<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Recipe Book</title>
<style>
  :root{
    --paper: #F2EFE9;
    --paper-raised: #FBF9F5;
    --ink: #2B2926;
    --ink-soft: #6B655C;
    --ink-faint: #A69F8F;
    --hairline: #DCD5C5;
    --hairline-strong: #C9C0AC;
    --danger: #A6503C;
    --danger-bg: #F3E7E2;
    --accent: #6B7561;
    --shadow: 0 1px 2px rgba(43,41,38,0.06), 0 8px 24px rgba(43,41,38,0.06);
    --font-display: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body{ overflow-x:hidden; }
  ::selection{ background: #D8D2C4; }
  button, input, textarea, select{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  input, textarea, select{ background:transparent; }
  #app{ min-height:100%; padding-bottom:100px; }
  a{ color:var(--accent); }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background: rgba(242,239,233,0.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--hairline);
    padding: 14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .title-wrap{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .book-title{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.2px;
    border:none; outline:none;
    background:transparent;
    color:var(--ink);
    width:auto;
    padding:2px 4px;
    border-radius:4px;
  }
  .book-title:focus{ background:var(--paper-raised); }
  .version-badge{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);
    border:1px solid var(--hairline-strong); border-radius:999px; padding:2px 7px;
    flex:0 0 auto;
  }
  .testing-badge{
    font-family:var(--font-body); font-size:10.5px; font-weight:600; letter-spacing:0.02em;
    color:var(--accent); background:rgba(107,117,97,0.12);
    border:1px solid var(--accent); border-radius:999px; padding:2px 8px;
    flex:0 0 auto; white-space:nowrap;
  }
  .topbar-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .icon-btn{
    border:1px solid var(--hairline-strong);
    background:var(--paper-raised);
    border-radius:999px;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, transform .1s;
    position:relative;
  }
  .icon-btn:active{ transform: scale(0.94); }
  .icon-btn svg{ width:16px; height:16px; stroke:var(--ink); fill:none; }
  .icon-btn.danger svg{ stroke:var(--danger); }
  .dirty-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--danger);
    position:absolute; top:-2px; right:-2px;
    box-shadow: 0 0 0 2px var(--paper);
  }
  .notes-badge{
    position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 3px;
    border-radius:999px; background:var(--accent); color:#fff; font-size:10px; font-weight:700;
    align-items:center; justify-content:center; box-shadow: 0 0 0 2px var(--paper);
  }

  /* ---------- Search ---------- */
  .search-row{ padding: 14px 20px 0 20px; }
  .search-input{
    width:100%; border:1px solid var(--hairline-strong); background:var(--paper-raised);
    border-radius:999px; padding:9px 16px; font-size:14px; outline:none; color:var(--ink);
    box-sizing:border-box;
  }
  .search-input::placeholder{ color:var(--ink-faint); }
  .search-input:focus{ border-color:var(--accent); }

  /* ---------- Category tabs ---------- */
  .cat-row-wrap{ display:flex; align-items:center; gap:8px; padding: 16px 20px 4px 20px; }
  .cat-row{
    display:flex; gap:8px; overflow-x:auto;
    scrollbar-width:none; flex:1; min-width:0;
  }
  .cat-row::-webkit-scrollbar{ display:none; }
  .pinned-manage-btn{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--hairline-strong); background:var(--paper-raised);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .cat-tab{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--hairline-strong);
    background:var(--paper-raised);
    font-size:13.5px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:7px;
    white-space:nowrap;
  }
  .cat-tab .dot{ width:7px; height:7px; border-radius:50%; }
  .cat-tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .cat-tab.active .dot{ background:var(--paper) !important; }

  /* ---------- Toolbar row ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 20px 6px 20px;
  }
  .count-label{ font-size:12.5px; color:var(--ink-faint); letter-spacing:0.3px; text-transform:uppercase; }
  .view-toggle{ display:flex; border:1px solid var(--hairline-strong); border-radius:8px; overflow:hidden; }
  .view-toggle button{
    border:none; background:var(--paper-raised); padding:6px 10px; display:flex; align-items:center;
  }
  .view-toggle button.active{ background:var(--ink); }
  .view-toggle button.active svg{ stroke:var(--paper); }
  .view-toggle svg{ width:15px; height:15px; stroke:var(--ink-soft); fill:none; }

  /* ---------- Recipe grid (tiles) ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:18px;
    padding: 10px 20px 20px 20px;
  }
  .tile{
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    border-radius: var(--radius-m);
    overflow:hidden;
    cursor:pointer;
    transition: box-shadow .15s, transform .1s;
  }
  .tile:active{ transform: scale(0.98); }
  .tile-img{
    width:100%; aspect-ratio: 4/5; object-fit:cover;
    background: linear-gradient(135deg, #E7E1D3, #DED6C3);
    display:block;
  }
  .tile-img.placeholder{ display:flex; align-items:center; justify-content:center; }
  .tile-img.placeholder svg{ width:26px; height:26px; stroke:var(--ink-faint); fill:none; opacity:0.6; }
  .cover-collage{ background:none; padding:0; overflow:hidden; }
  .cover-collage.cover-collage-2{ display:flex; flex-direction:row; gap:2px; }
  .cover-collage.cover-collage-2 img{ width:calc(50% - 1px); height:100%; object-fit:cover; display:block; }
  .cover-collage.cover-collage-grid{ display:flex; flex-wrap:wrap; gap:2px; align-content:flex-start; }
  .cover-collage.cover-collage-grid img{ width:calc(50% - 1px); height:calc(50% - 1px); object-fit:cover; display:block; }
  .list-thumb.cover-collage{ border-radius:8px; }
  .tile-body{ padding:10px 12px 12px 12px; }
  .tile-name{ font-family:var(--font-display); font-size:15px; line-height:1.3; }
  .tile-tags{ margin-top:5px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .tile-tags .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .tile-tags span.lbl{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- List view ---------- */
  .list{ padding: 6px 20px 20px 20px; }
  .list-row{
    display:flex; align-items:center; gap:14px;
    padding: 11px 4px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
  }
  .list-row:active{ background: var(--paper-raised); }
  .shop-add-btn{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--hairline-strong);
    background:var(--paper-raised); font-size:15px; display:flex; align-items:center; justify-content:center;
    opacity:0.6;
  }
  .shop-add-btn.active{ opacity:1; background:var(--accent); border-color:var(--accent); }
  .tile-img-wrap{ position:relative; }
  .tile-shop-btn{
    position:absolute; top:8px; right:8px; width:32px; height:32px;
    background:rgba(251,249,245,0.92); box-shadow: 0 1px 4px rgba(43,41,38,0.15);
  }
  .list-thumb{
    width:52px; height:52px; border-radius:8px; object-fit:cover; flex:0 0 auto;
    background: linear-gradient(135deg, #E7E1D3, #DED6C3);
  }
  .list-thumb.placeholder{ display:flex; align-items:center; justify-content:center; }
  .list-thumb.placeholder svg{ width:18px; height:18px; stroke:var(--ink-faint); fill:none; opacity:0.6; }
  .list-info{ min-width:0; }
  .list-info .list-name{ font-family:var(--font-display); font-size:15.5px; }
  .pantry-list-name{ font-family:var(--font-display); font-size:15.5px; color:var(--ink); }
  .pantry-list-meta{ display:flex; align-items:baseline; gap:8px; margin-top:3px; flex-wrap:wrap; }
  .pantry-list-type{ font-size:12.5px; font-style:italic; color:var(--ink-soft); }
  .pantry-list-brand{ font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); }
  .pantry-list-price{ font-size:12.5px; color:var(--accent); font-weight:600; }
  .pantry-list-qty{ font-size:12.5px; color:var(--ink-soft); }
  .pantry-pq-row{ display:flex; gap:10px; margin-top:8px; }
  .pantry-pq-input{
    flex:1; border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px;
    padding:9px 12px; font-size:14px; outline:none;
  }
  .pantry-pq-static{ margin-top:8px; font-size:14px; color:var(--ink-soft); }
  .pantry-pq-static span:first-child{ color:var(--accent); font-weight:600; }
  .list-info .tile-tags{ margin-top:3px; }
  .recipe-list-row{ padding: 14px 4px; gap:16px; }
  .recipe-list-thumb{ width:68px; height:68px; }
  .recipe-list-thumb.placeholder svg{ width:24px; height:24px; }
  .recipe-list-name{ font-size:17.5px; }

  /* ---------- Empty state ---------- */
  .empty{
    margin: 60px auto; max-width:340px; text-align:center; padding: 0 20px;
  }
  .empty svg{ width:34px; height:34px; stroke:var(--ink-faint); fill:none; margin-bottom:14px; }
  .empty h3{ font-family:var(--font-display); font-weight:600; font-size:19px; margin:0 0 6px 0; }
  .empty p{ color:var(--ink-soft); font-size:14px; line-height:1.5; margin:0 0 18px 0; }
  .empty button{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:9px 18px; border-radius:999px; font-size:13.5px;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:22px; bottom:26px; z-index:30;
    width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    border:none; transition: transform .12s;
  }
  .fab:active{ transform: scale(0.92); }
  .fab svg{ width:22px; height:22px; stroke:var(--paper); fill:none; }

  /* ---------- Recipe view ---------- */
  .rv-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 14px 16px; position:sticky; top:0; z-index:20;
    background: rgba(242,239,233,0.92); backdrop-filter: blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .rv-header-left, .rv-header-right{ display:flex; align-items:center; gap:6px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; border:none; background:none;
    font-size:14.5px; color:var(--ink-soft); padding:6px 4px;
  }
  .back-btn svg{ width:17px; height:17px; stroke:var(--ink-soft); fill:none; }
  .text-btn{ border:none; background:none; font-size:14.5px; padding:6px 8px; color:var(--ink-soft); }
  .text-btn.primary{ color:var(--ink); font-weight:600; }
  .text-btn.primary:disabled{ color:var(--ink-faint); font-weight:400; }
  .text-btn.danger{ color:var(--danger); }
  .rv-body{ max-width:640px; margin:0 auto; padding: 8px 20px 60px 20px; }

  /* ---------- Book view shell: fixed header, independently scrolling pages ---------- */
  .book-shell{
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:var(--paper); height:100vh; height:100dvh;
  }
  .book-shell .book-header{
    position:static; flex:0 0 auto; z-index:20;
  }
  .book-shell .book-spread{
    flex:1 1 auto; min-height:0; padding:0; margin:0;
    display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .book-shell .book-page{ padding: 0 20px; }
  .book-shell .book-page-left{ padding-top:16px; }
  .book-shell .book-page-right{ padding-top:0; padding-bottom:40px; }
  @media (min-width: 860px){
    .book-shell .book-spread{
      flex-direction:row; align-items:stretch; overflow:hidden;
    }
    .book-shell .book-page{
      overflow-y:auto; -webkit-overflow-scrolling:touch; height:100%;
    }
    .book-shell .book-page-left{
      flex:0 0 40%; max-width:420px; padding: 20px 32px 40px 28px;
      border-right:1px solid var(--hairline-strong);
    }
    .book-shell .book-page-right{ flex:1; min-width:0; padding: 20px 28px 40px 32px; }
  }

  .quickfill-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .quickfill-row button{
    border:1px dashed var(--hairline-strong); background:var(--paper-raised); border-radius:999px;
    padding:8px 14px; font-size:13px; color:var(--ink-soft);
  }
  .rv-image-wrap{
    width:100%; aspect-ratio: 16/10; border-radius: var(--radius-l);
    background: linear-gradient(135deg, #E7E1D3, #DED6C3);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin: 14px 0 22px 0; position:relative;
    border:1px solid var(--hairline);
  }
  .rv-image-wrap.editable{ cursor:pointer; }
  .rv-image-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rv-image-wrap .upload-hint{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--ink-faint);
  }
  .rv-image-wrap .upload-hint svg{ width:26px; height:26px; stroke:var(--ink-faint); fill:none; }
  .rv-image-wrap .upload-hint span{ font-size:12.5px; letter-spacing:0.3px; }
  .rv-image-wrap .change-overlay{
    position:absolute; bottom:10px; right:10px;
    background: rgba(43,41,38,0.72); color:var(--paper);
    font-size:11.5px; padding:5px 10px; border-radius:999px; letter-spacing:0.3px;
  }
  .image-link-row{ margin-top:-14px; margin-bottom:20px; }
  .image-link-toggle{
    border:none; background:none; font-size:12.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; padding:4px 0;
  }
  .image-link-toggle svg{ width:13px; height:13px; stroke:var(--ink-soft); fill:none; }
  .image-link-input-row{ display:flex; gap:8px; margin-top:8px; }
  .image-link-input{
    flex:1; border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px;
    padding:9px 12px; font-size:14px; outline:none;
  }

  .rv-carousel-outer{ margin: 14px 0 8px 0; }
  .rv-carousel{
    display:flex; overflow-x:auto; scroll-snap-type: x mandatory; gap:0;
    border-radius: var(--radius-l); scrollbar-width:none;
  }
  .rv-carousel::-webkit-scrollbar{ display:none; }
  .rv-carousel-slide{
    flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 16/10;
    background: linear-gradient(135deg, #E7E1D3, #DED6C3);
    display:flex; align-items:center; justify-content:center;
    position:relative; border-radius: var(--radius-l); overflow:hidden;
    border:1px solid var(--hairline);
  }
  .rv-carousel-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rv-carousel-img-enlargeable{ cursor:pointer; }
  .rv-carousel-slide.rv-carousel-add{ cursor:pointer; }
  .rv-carousel-slide.rv-carousel-add .upload-hint{
    display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-faint);
  }
  .rv-carousel-slide.rv-carousel-add .upload-hint svg{ width:26px; height:26px; stroke:var(--ink-faint); fill:none; }
  .rv-carousel-slide.rv-carousel-add .upload-hint span{ font-size:12.5px; letter-spacing:0.3px; }
  .carousel-del{
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(43,41,38,0.72); border:none; display:flex; align-items:center; justify-content:center;
  }
  .carousel-del svg{ width:14px; height:14px; stroke:var(--paper); fill:none; }
  .rv-carousel-dots{ display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .rv-dot{ width:6px; height:6px; border-radius:50%; background:var(--hairline-strong); }
  .rv-dot.active{ background:var(--accent); width:16px; border-radius:4px; transition: width .15s, background .15s; }

  .rv-title{
    font-family:var(--font-display); font-size:30px; font-weight:600; line-height:1.2;
    border:none; outline:none; width:100%; background:transparent; padding:2px 0;
  }
  .rv-title::placeholder{ color: var(--ink-faint); font-weight:500; }
  .rv-title-static{ font-family:var(--font-display); font-size:30px; font-weight:600; line-height:1.2; }
  .rv-variant-sub{ font-size:13px; color:var(--accent); margin-top:2px; font-weight:600; letter-spacing:0.2px; }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--hairline-strong); background:var(--paper-raised); font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .chip.selected{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .chip.selected .dot{ background:var(--paper) !important; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .chip.add-chip{ border-style:dashed; }
  .chip.readonly{ cursor:default; }

  .rv-desc{
    margin-top:16px; width:100%; border:none; outline:none; resize:none;
    font-size:15px; line-height:1.55; color:var(--ink-soft); background:transparent;
    min-height:24px; font-family:var(--font-body);
  }
  .rv-desc::placeholder{ color:var(--ink-faint); }
  .rv-desc-static{ margin-top:16px; font-size:15px; line-height:1.55; color:var(--ink-soft); white-space:pre-wrap; }

  .optional-section-chips{ display:flex; gap:8px; flex-wrap:wrap; margin: 18px 0 4px 0; }
  .optional-section-chips button{
    border:1px dashed var(--hairline-strong); background:none; border-radius:999px;
    padding:6px 12px; font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;
  }
  .optional-section-chips button svg{ width:12px; height:12px; stroke:var(--ink-soft); fill:none; }

  /* ---------- Sections ---------- */
  .section{ margin-top:8px; border-top:1px solid var(--hairline); }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 0; cursor:pointer;
  }
  .section-head-left{ display:flex; align-items:center; gap:8px; }
  .section-head h4{
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin:0;
  }
  .section-head .chev{ width:14px; height:14px; stroke:var(--ink-faint); fill:none; transition: transform .18s; }
  .section-head .chev.open{ transform: rotate(180deg); }
  .section-remove{ border:none;background:none; width:20px;height:20px; display:flex;align-items:center;justify-content:center; opacity:0.5; }
  .section-remove svg{ width:12px;height:12px; stroke:var(--ink-soft); fill:none;}
  .section-body{ overflow:hidden; max-height:0; transition: max-height .22s ease; }
  .section-body.open{ max-height:5000px; }
  .section-body-inner{ padding-bottom:18px; }

  /* Line-list rows (storage, prep) */
  .line-list{ list-style:none; margin:0; padding:0; }
  .line-item{ display:flex; align-items:flex-start; gap:8px; padding:6px 0; }
  .line-text{ flex:1; border:none; outline:none; background:transparent; font-size:14.5px; line-height:1.5; padding-top:1px; }
  .line-text::placeholder{ color:var(--ink-faint); }
  .line-text-static{ flex:1; font-size:14.5px; line-height:1.55; padding-top:1px; }
  .row-actions{ display:flex; gap:2px; flex:0 0 auto; }
  .row-add, .row-del{ width:22px; height:22px; border:none; background:none; display:flex; align-items:center; justify-content:center; opacity:0.5; }
  .opt-toggle-btn{
    border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:6px;
    height:22px; padding:0 6px; font-size:10px; letter-spacing:0.3px; color:var(--ink-faint);
  }
  .opt-toggle-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .row-add svg, .row-del svg{ width:13px; height:13px; stroke:var(--ink-soft); fill:none; }
  .add-row-btn{
    display:flex; align-items:center; gap:6px; border:none; background:none;
    color:var(--ink-soft); font-size:13.5px; padding:8px 0 0 0; margin-top:2px;
  }
  .add-row-btn svg{ width:14px; height:14px; stroke:var(--ink-soft); fill:none; }

  /* Preparation plan — timeline signature element */
  .prep-list{ list-style:none; margin:0; padding:0; }
  .prep-item{ position:relative; padding-left:26px; padding-bottom:16px; }
  .prep-item:last-child{ padding-bottom:4px; }
  .prep-item::before{
    content:''; position:absolute; left:5px; top:6px; width:8px; height:8px;
    border-radius:50%; border:2px solid var(--accent); background:var(--paper);
  }
  .prep-item::after{
    content:''; position:absolute; left:8.5px; top:16px; bottom:0; width:1px;
    background: var(--hairline-strong);
  }
  .prep-item:last-child::after{ display:none; }
  .prep-row{ display:flex; align-items:flex-start; gap:8px; }

  /* Yield / variant strip */
  .yv-strip{ padding: 16px 0 10px 0; border-top:1px solid var(--hairline); }
  .book-left-lower{ margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline-strong); }
  .book-left-lower .section-header{ font-size:12.5px; }
  .book-yv-strip{ border-top:none; padding-top:2px; }
  .yield-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .yield-label{ font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-weight:600; }
  .stepper{ display:flex; align-items:center; gap:10px; border:1px solid var(--hairline-strong); border-radius:999px; padding:4px 6px; }
  .stepper button{ width:26px;height:26px;border-radius:50%;border:none;background:var(--paper-raised); display:flex;align-items:center;justify-content:center; }
  .stepper button svg{ width:12px;height:12px;stroke:var(--ink); fill:none; }
  .stepper .yield-num{ font-family:var(--font-mono); font-size:14px; min-width:22px; text-align:center; }
  .yield-unit-input{ font-size:13px; color:var(--ink-soft); border:none; outline:none; background:transparent; width:90px; border-bottom:1px dashed var(--hairline-strong); padding:2px 0; }
  .yield-base-row{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); }
  .yield-base-row input{ width:36px; border:none; border-bottom:1px dashed var(--hairline-strong); background:transparent; font-family:var(--font-mono); font-size:11.5px; text-align:center; outline:none; }
  .yield-static{ font-size:14px; color:var(--ink-soft); }
  .yield-strip-subtle{ margin-bottom:14px; opacity:0.85; }
  .yield-strip-subtle .yield-row{ margin-bottom:0; }
  .yield-strip-subtle .yield-static{ font-size:12px; }
  .yield-strip-subtle .stepper{ padding:2px 4px; gap:6px; border-color:var(--hairline); }
  .yield-strip-subtle .stepper button{ width:20px; height:20px; }
  .yield-strip-subtle .stepper button svg{ width:9px; height:9px; }
  .yield-strip-subtle .stepper .yield-num{ font-size:12px; min-width:16px; }

  .variant-row-wrap{ display:flex; align-items:center; gap:8px; }
  .variant-row{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; flex:1; min-width:0; }
  .variant-row::-webkit-scrollbar{ display:none; }
  .variant-pill{ flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1px solid var(--hairline-strong); background:var(--paper-raised); font-size:12.5px; color:var(--ink-soft); }
  .variant-pill.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .variant-rename-btn{ flex:0 0 auto; border:none; background:none; font-size:12px; padding:0 4px; opacity:0.75; }

  /* N/A yield */
  .yield-na-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .yield-na-row input{ width:14px; height:14px; }
  .yield-reset-btn{ border:none; background:none; opacity:0.55; display:flex; align-items:center; justify-content:center; width:22px; height:22px; }
  .yield-reset-btn svg{ width:13px; height:13px; stroke:var(--ink-soft); fill:none; }

  /* Recipe links */
  .field-with-link{ display:flex; align-items:flex-start; gap:4px; flex:1; min-width:0; position:relative; flex-wrap:wrap; }
  .fmt-toolbar{ display:none; align-items:center; gap:4px; width:100%; order:-1; margin-bottom:2px; }
  .fmt-toolbar button{
    border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:6px;
    width:26px; height:24px; font-size:12.5px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .fmt-toolbar button:active{ background:var(--ink); color:var(--paper); }
  .link-insert-btn{ border:none; background:none; opacity:0.7; display:flex; align-items:center; justify-content:center; width:26px; height:26px; flex:0 0 auto; margin-top:1px; }
  .link-insert-btn svg{ width:13px; height:13px; stroke:var(--accent); fill:none; }
  a.recipe-link, a.pantry-link-ref, a.equipment-link-ref{ color:var(--accent); text-decoration:underline; text-decoration-color: var(--hairline-strong); cursor:pointer; }
  .linked-from-label{ margin-top:18px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-faint); font-weight:600; }
  .settings-block-title{ margin-top:0; margin-bottom:8px; }
  #ovenStaticWrap + #equipmentStaticWrap{ margin-top:16px; }
  .linked-from-row{ margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---------- Shopping list ---------- */
  .shop-list{ list-style:none; margin:0 0 6px 0; padding:0; }
  .shop-item{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); }
  .shop-thumb{ width:36px; height:36px; border-radius:7px; object-fit:cover; flex:0 0 auto; background: linear-gradient(135deg, #E7E1D3, #DED6C3); }
  .shop-thumb.placeholder{ display:flex; align-items:center; justify-content:center; }
  .shop-thumb.placeholder svg{ width:14px; height:14px; stroke:var(--ink-faint); fill:none; opacity:0.6; }
  .shop-group-dot{ width:8px; height:8px; margin-right:8px; display:inline-block; }
  .shop-check{
    flex:0 0 auto; width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--hairline-strong); background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
  }
  .shop-check.checked{ background:var(--accent); border-color:var(--accent); }
  .shop-check svg{ width:12px; height:12px; stroke:var(--paper); fill:none; opacity:0; }
  .shop-check.checked svg{ opacity:1; }
  .shop-line-text{ flex:1; font-size:14.5px; }
  .shop-line-text .amt{ font-family:var(--font-mono); }
  .shop-remove{ flex:0 0 auto; opacity:0.5; }

  /* ---------- Book mode ---------- */
  .book-chapter{ margin-bottom:26px; }
  .book-chapter-title{ font-family:var(--font-display); font-size:21px; font-weight:600; color:var(--ink); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--hairline-strong); }
  .book-chapter-list{ list-style:none; margin:0; padding:0; }
  .book-toc-item{ display:flex; align-items:center; gap:12px; padding:8px 2px; font-size:15px; border-bottom:1px solid var(--hairline); cursor:pointer; }
  .book-toc-thumb{ width:44px; height:44px; }
  .book-toc-name{ flex:1; }
  .book-toc-item:active{ background:var(--paper-raised); }
  .book-position{ font-size:12px; color:var(--ink-soft); white-space:nowrap; margin-right:4px; }
  .book-page-left .rv-image-wrap, .book-page-left .rv-carousel-outer{ margin-top:0; }
  .linked-from-pill{
    font-size:12px; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--hairline-strong);
    border-radius:999px; padding:4px 12px 4px 4px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  }
  .linked-from-thumb{
    width:22px; height:22px; border-radius:50%; object-fit:cover; flex:0 0 auto;
    background: linear-gradient(135deg, #E7E1D3, #DED6C3);
  }
  .linked-from-thumb.placeholder{ display:flex; align-items:center; justify-content:center; }
  .linked-from-thumb.placeholder svg{ width:10px; height:10px; stroke:var(--ink-faint); fill:none; opacity:0.6; }

  /* Recipe picker modal */
  .picker-search{ width:100%; border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px; padding:9px 12px; font-size:14px; outline:none; margin-bottom:10px; }
  .picker-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); font-weight:600; padding:10px 6px 4px 6px; }
  .settings-menu{ display:flex; flex-direction:column; }
  .settings-menu-item{
    display:flex; align-items:center; gap:12px; border:none; background:none; width:100%;
    text-align:left; padding:13px 4px; font-size:15px; color:var(--ink); border-bottom:1px solid var(--hairline);
  }
  .settings-menu-item:last-child{ border-bottom:none; }
  .settings-menu-item svg{ width:18px; height:18px; stroke:var(--ink-soft); fill:none; flex:0 0 auto; }
  .settings-menu-item.danger{ color:var(--danger); }
  .settings-menu-item.danger svg{ stroke:var(--danger); }
  .quicknote-item{ padding:10px 0; border-bottom:1px solid var(--hairline); }
  .quicknote-item:last-child{ border-bottom:none; }
  .quicknote-date{ font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-faint); margin-bottom:4px; }
  .quicknote-row{ display:flex; align-items:flex-start; gap:8px; }
  .quicknote-text{
    flex:1; border:none; outline:none; background:transparent; resize:none;
    font-size:14px; line-height:1.5; padding:0; min-height:20px;
  }
  .quicknote-text::placeholder{ color:var(--ink-faint); }
  .quicknote-del{ flex:0 0 auto; opacity:0.5; }
  .picker-item{ padding:10px 6px; border-bottom:1px solid var(--hairline); font-size:14.5px; cursor:pointer; }
  .picker-item:active{ background:var(--paper-raised); }
  .picker-empty{ font-size:13.5px; color:var(--ink-faint); padding:14px 6px; text-align:center; }

  /* ---------- Pantry ---------- */
  .pantry-type-input{
    display:block; margin-top:6px; border:none; outline:none; background:transparent;
    font-size:14px; color:var(--ink-soft); padding:2px 0; width:100%;
    border-bottom:1px dashed var(--hairline-strong);
  }
  .pantry-type-static{ font-size:14px; color:var(--ink-soft); margin-top:4px; }
  .pantry-sublabel{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-faint); margin: 20px 0 8px 0; font-weight:600; }
  .pantry-brand-input{
    flex:1; border:1px solid var(--hairline-strong); background:var(--paper); border-radius:8px;
    padding:7px 10px; font-size:13.5px; outline:none;
  }
  .pantry-store-row{ display:flex; align-items:center; gap:6px; padding:6px 0; }
  .pantry-store-name{ flex:1 1 100px; min-width:70px; border:1px solid var(--hairline-strong); background:var(--paper); border-radius:8px; padding:7px 10px; font-size:13.5px; outline:none; }
  .pantry-store-url{ flex:1.4 1 140px; min-width:90px; border:1px solid var(--hairline-strong); background:var(--paper); border-radius:8px; padding:7px 10px; font-size:13.5px; outline:none; color:var(--accent); }
  .pantry-open-link{ flex:0 0 auto; width:26px; height:26px; border:none; background:none; display:flex; align-items:center; justify-content:center; opacity:0.6; }
  .pantry-open-link svg{ width:14px; height:14px; stroke:var(--accent); fill:none; }
  .pantry-store-view-list{ display:flex; flex-direction:column; gap:4px; }
  .pantry-store-view-row{ font-size:14.5px; display:flex; gap:8px; }
  .pantry-store-view-row a{ color:var(--accent); word-break:break-all; }
  .pantry-notes-preview{ font-size:12.5px; color:var(--ink-faint); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Ingredients */
  .ing-list{ list-style:none; margin:0; padding:0; }
  .ing-item{ display:flex; align-items:flex-start; gap:8px; padding:6px 0; }
  .ing-check{ flex:0 0 auto; width:18px; height:18px; border-radius:5px; margin-top:2px; border:1.5px solid var(--hairline-strong); background:var(--paper-raised); display:flex; align-items:center; justify-content:center; }
  .ing-check.checked{ background:var(--accent); border-color:var(--accent); }
  .ing-check svg{ width:11px; height:11px; stroke:var(--paper); fill:none; opacity:0; }
  .ing-check.checked svg{ opacity:1; }
  .ing-fields{ flex:1; display:flex; align-items:baseline; gap:8px; min-width:0; flex-wrap:wrap; }
  .ing-amt{ width:46px; border:none; outline:none; background:transparent; font-family:var(--font-mono); font-size:14px; text-align:right; padding-top:1px; }
  .ing-unit{ width:48px; border:none; outline:none; background:transparent; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); padding-top:1px; }
  .ing-name{ flex:1; min-width:80px; border:none; outline:none; background:transparent; font-size:14.5px; padding-top:1px; }
  .ing-name.checked, .ing-amt.checked, .ing-unit.checked{ color:var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--hairline-strong); }
  .ing-fields input::placeholder{ color:var(--ink-faint); font-family:var(--font-body); }
  .ing-static{ font-size:14.5px; }
  .ing-static .amt{ font-family:var(--font-mono); }
  .ing-static-name.checked{ color:var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--hairline-strong); }
  .ing-group-label{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink); margin: 22px 0 10px 0; letter-spacing:0.1px; }
  .ing-group-label:first-child{ margin-top:0; }
  .ing-group-header{ display:flex; align-items:center; gap:8px; margin: 22px 0 10px 0; }
  .ing-group-name-input{
    flex:1; border:none; border-bottom:1px dashed var(--hairline-strong); background:transparent;
    font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink); padding:2px 0; outline:none;
  }
  .ing-group-del{ flex:0 0 auto; opacity:0.5; }

  /* Instructions */
  .instr-list{ list-style:none; margin:0; padding:0; }
  .instr-item{ display:flex; align-items:flex-start; gap:12px; padding:8px 0; }
  .instr-check{
    flex:0 0 auto; width:18px; height:18px; border-radius:5px; margin-top:2px;
    border:1.5px solid var(--hairline-strong); background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
  }
  .instr-check.checked{ background:var(--accent); border-color:var(--accent); }
  .instr-check svg{ width:11px; height:11px; stroke:var(--paper); fill:none; opacity:0; }
  .instr-check.checked svg{ opacity:1; }
  .instr-num-inline{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); }
  .instr-done{ color:var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--hairline-strong); }
  .instr-num{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--paper-raised); border:1px solid var(--hairline-strong); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .instr-text{ flex:1; border:none; outline:none; resize:none; background:transparent; font-size:14.5px; line-height:1.55; font-family:var(--font-body); min-height:22px; padding-top:2px; }
  .instr-text::placeholder{ color:var(--ink-faint); }
  .instr-static{ flex:1; font-size:14.5px; line-height:1.6; padding-top:2px; }
  .instr-actions{ display:flex; flex-direction:column; gap:2px; }
  .instr-content-col{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .instr-photo-btn{ flex:0 0 auto; border:none; background:none; opacity:0.5; display:flex; align-items:center; justify-content:center; width:22px; height:22px; margin-top:1px; }
  .instr-photo-btn svg{ width:15px; height:15px; stroke:var(--accent); fill:none; }
  .instr-photo-grid{ display:flex; gap:8px; flex-wrap:wrap; }
  .instr-photo-thumb-wrap{ position:relative; width:60px; height:60px; border-radius:8px; overflow:hidden; border:1px solid var(--hairline); }
  .instr-photo-thumb{ width:60px; height:60px; object-fit:cover; display:block; cursor:pointer; border-radius:8px; }
  .instr-photo-thumb-wrap .instr-photo-thumb{ border-radius:0; }
  .instr-photo-del{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(43,41,38,0.72); border:none; display:flex; align-items:center; justify-content:center;
  }
  .instr-photo-del svg{ width:10px; height:10px; stroke:var(--paper); fill:none; }
  .quicknote-photo-del{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(43,41,38,0.72); border:none; display:flex; align-items:center; justify-content:center;
  }
  .quicknote-photo-del svg{ width:10px; height:10px; stroke:var(--paper); fill:none; }

  /* Oven block */
  .oven-row-edit{ display:flex; flex-wrap:wrap; gap:18px 34px; padding: 14px 0 18px 0; border-bottom:1px dashed var(--hairline-strong); margin-bottom:14px; position:relative; }
  .oven-row-edit:first-child{ padding-top:2px; }
  .ovenRowDel{ position:absolute; top:12px; right:0; }
  .oven-field{ display:flex; flex-direction:column; gap:5px; }
  .oven-field label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); }
  .oven-field .row{ display:flex; align-items:center; gap:6px; }
  .oven-field input[type=number]{ width:58px; border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px; padding:6px 8px; font-family:var(--font-mono); font-size:13.5px; outline:none; }
  .oven-field select, .oven-field input[type=text]{ border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px; padding:6px 8px; font-size:13px; outline:none; }
  .unit-toggle{ display:flex; border:1px solid var(--hairline-strong); border-radius:8px; overflow:hidden; }
  .unit-toggle button{ border:none; background:var(--paper-raised); padding:6px 9px; font-size:12px; color:var(--ink-soft); }
  .unit-toggle button.active{ background:var(--ink); color:var(--paper); }
  .oven-row-group{ padding-bottom:2px; }
  .oven-row-label{ font-size:12px; font-weight:600; color:var(--accent); margin-bottom:6px; letter-spacing:0.2px; }
  .oven-static{ display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-soft); }
  .oven-static b{ color:var(--ink); font-weight:600; margin-right:8px; }
  .equipment-row-edit{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--hairline-strong); }
  .equipment-row-edit:last-of-type{ border-bottom:none; }
  .equipmentTypeSelect{ flex:0 0 auto; max-width:160px; border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:8px; padding:8px 10px; font-size:13px; outline:none; }
  .equipmentDetailInput{ width:100%; border:none; outline:none; background:transparent; font-size:14px; padding:0; }
  .equipment-row-static{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px; font-size:13.5px; color:var(--ink-soft); }
  .settings-combined-wrap{ padding-bottom:18px; border-bottom:1px dashed var(--hairline-strong); margin-bottom:16px; }
  .equipment-row-static b{ color:var(--ink); font-weight:600; margin-right:8px; }
  .equipment-row-thumb{ cursor:pointer; }

  /* Source line */
  .source-row{ margin-top:26px; padding-top:14px; border-top:1px solid var(--hairline); font-size:12.5px; color:var(--ink-faint); }
  .source-row input{ width:100%; border:none; outline:none; background:transparent; font-size:12.5px; color:var(--ink-soft); }
  .source-row input::placeholder{ color:var(--ink-faint); }
  .source-row a{ word-break:break-all; }
  .reference-row{ margin-top:10px; }
  .reference-btn{
    border:1px solid var(--hairline-strong); background:var(--paper-raised); border-radius:999px;
    padding:6px 13px; font-size:12.5px; color:var(--ink-soft);
  }
  .reference-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:10px; margin-bottom:6px; }
  .reference-thumb-wrap{ position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--hairline); }
  .reference-thumb{ width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
  .reference-remove{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(43,41,38,0.72); border:none; display:flex; align-items:center; justify-content:center;
  }
  .reference-remove svg{ width:12px; height:12px; stroke:var(--paper); fill:none; }

  /* ---------- Modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background: rgba(43,41,38,0.36); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
  @media (min-width:600px){ .modal-backdrop{ align-items:center; } }
  .modal{ background:var(--paper); width:100%; max-width:420px; border-radius: 20px 20px 0 0; padding: 20px 20px 28px 20px; max-height:80vh; overflow-y:auto; box-shadow: 0 -4px 30px rgba(0,0,0,0.15); }
  @media (min-width:600px){ .modal{ border-radius:16px; } }

  .kitchen-ing-list{ list-style:none; margin:0; padding:0; }

  .kitchen-ing-list .amt{ font-family:var(--font-mono); min-width:70px; text-align:right; color:var(--ink-soft); }
  .kitchen-instr-list{ list-style:none; margin:0; padding:0; counter-reset:k; }
  .kitchen-instr-list li{ font-size:18px; line-height:1.7; display:flex; align-items:flex-start; gap:14px; margin-bottom:18px; }
  .kitchen-instr-num{ font-family:var(--font-mono); font-size:15px; color:var(--ink-faint); flex:0 0 auto; min-width:24px; }
  .kitchen-check{
    flex:0 0 auto; width:26px; height:26px; border-radius:7px; margin-top:2px;

  .kitchen-source{ margin-top:36px; padding-top:16px; border-top:1px solid var(--hairline); font-size:13px; color:var(--ink-faint); }
  .print-photos-toggle{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }

<div id="app"></div>

<script>
/* =========================================================
   CONSTANTS
========================================================= */
const APP_VERSION = "v52";
const DEFAULT_CATEGORIES = ["Dessert","Dinner","Bites","Drinks","Side Dishes","Batch Cooking"];
const ACCENTS = ["#7C5A6B","#6B7561","#A68A5B","#5C7A80","#8A8F5C","#9C6B54","#5E6B8A","#8B6F8C"];
const OVEN_SETTINGS = ["With fan","Without fan","Turbo","Airfry","Other"];
const DEFAULT_EQUIPMENT_TYPES = ["Oven (Smeg)","Oven (Other)","Airfryer","Microwave","Frying pan","Perforated baking sheet","Baking sheet"];
const DEFAULT_EQUIPMENT_CATEGORIES = ["Bakeware & molds","Large appliances","Miscellaneous","Pots and pans","Sheet pans","Small appliances","Tools","Utensils"];

/* =========================================================
   STORAGE — IndexedDB (with one-time migration from localStorage)
========================================================= */
const IDB_NAME = 'RecipeBookDB';
const IDB_VERSION = 1;
const IDB_STORE = 'appData';
const IDB_KEY = 'recipeBookData';
const LEGACY_LS_KEY = 'recipeBookData';
let idbInstance = null;
function openIDB(){
  return new Promise((resolve, reject)=>{
    if(idbInstance){ resolve(idbInstance); return; }
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB is not available in this browser')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e)=>{
      idbInstance = e.target.result;
      // The connection can be closed by the browser at any time (e.g. after the
      // tab sits backgrounded for a while) — clear our cached handle when that
      // happens so the next call transparently reopens a fresh one.
      idbInstance.onclose = ()=>{ idbInstance = null; };
      idbInstance.onversionchange = ()=>{ try{ idbInstance.close(); }catch(e){} idbInstance = null; };
      resolve(idbInstance);
    };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function idbGet(key, isRetry){
  return openIDB().then(db=> new Promise((resolve, reject)=>{
    let tx;
    try{
      tx = db.transaction(IDB_STORE, 'readonly');
    }catch(err){
      idbInstance = null;
      reject(err);
      return;
    }
    const store = tx.objectStore(IDB_STORE);
    const req = store.get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  })).catch(err=>{
    if(!isRetry && err && err.name === 'InvalidStateError'){
      idbInstance = null;
      return idbGet(key, true);
    }
    throw err;
  });
}
function idbSet(key, value, isRetry){
  return openIDB().then(db=> new Promise((resolve, reject)=>{
    let tx;
    try{
      tx = db.transaction(IDB_STORE, 'readwrite');
    }catch(err){
      idbInstance = null;
      reject(err);
      return;
    }
    const store = tx.objectStore(IDB_STORE);
    const req = store.put(value, key);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  })).catch(err=>{
    if(!isRetry && err && err.name === 'InvalidStateError'){
      idbInstance = null;
      return idbSet(key, value, true);
    }
    throw err;
  });
}
/* Loads app data at startup: tries IndexedDB first; if empty, migrates
   any existing localStorage data over (one-time); falls back to defaults. */
async function loadAppData(){
  const defaults = { title:"Recipe Book", categories:[...DEFAULT_CATEGORIES], recipes:[], pantryCategories:[], pantry:[], shoppingList:[], equipmentCategories:[...DEFAULT_EQUIPMENT_CATEGORIES], equipment:[], equipmentTypes:[...DEFAULT_EQUIPMENT_TYPES] };
  try{
    const fromIDB = await idbGet(IDB_KEY);
    if(fromIDB) return fromIDB;
  }catch(err){
    console.error('IndexedDB read failed, will try localStorage fallback:', err);
  }
  try{
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      idbSet(IDB_KEY, parsed).catch(err=> console.error('Migration write to IndexedDB failed:', err));
      return parsed;
    }
  }catch(err){
    console.error('LocalStorage fallback read failed:', err);
  }
  return defaults;
}


/* =========================================================
   DATA / STATE
========================================================= */
let data = { title:"Recipe Book", categories:[...DEFAULT_CATEGORIES], recipes:[], pantryCategories:[], pantry:[], shoppingList:[], equipmentCategories:[...DEFAULT_EQUIPMENT_CATEGORIES], equipment:[], equipmentTypes:[...DEFAULT_EQUIPMENT_TYPES] };
let dirty = false;
let draftRecipe = null; // holds an unsaved new recipe until first Save
let draftPantryItem = null; // holds an unsaved new pantry item until first Save
let wakeLockRef = null;

let state = {
  view: "home",
  activeCategory: "All",
  viewMode: "tile",
  recipeId: null,
  isNew: false,
  isEditing: false,
  editSnapshot: null,
  openSections: { storage:true, prep:true, ingredients:true, instructions:true, source:true, notes:false },
  kitchenMode: false,
  pantryActiveCategory: "All",
  pantryViewMode: "tile",
  pantryItemId: null,
  pantryIsNew: false,
  pantryIsEditing: false,
  pantryEditSnapshot: null,
  currentYield: null,
  currentMultiplier: null,
  linkPickerTarget: null,
  archiveViewMode: "tile",
  homeSearchQuery: "",
  pantrySearchQuery: "",
  equipmentActiveCategory: "All",
  equipmentViewMode: "tile",
  equipmentItemId: null,
  equipmentIsNew: false,
  equipmentIsEditing: false,
  equipmentEditSnapshot: null,
  equipmentSearchQuery: "",
  recipeOrigin: "home",
  bookOrder: [],
  bookIndex: 0,
  bookTocFilter: "all"
};
let draftEquipmentItem = null;

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function accentFor(cat){
  const idx = data.categories.indexOf(cat);
  return ACCENTS[(idx < 0 ? 0 : idx) % ACCENTS.length];
}
function pantryAccentFor(cat){
  const idx = data.pantryCategories.indexOf(cat);
  return ACCENTS[(idx < 0 ? 0 : idx) % ACCENTS.length];
}
function equipmentAccentFor(cat){
  const idx = data.equipmentCategories.indexOf(cat);
  return ACCENTS[(idx < 0 ? 0 : idx) % ACCENTS.length];
}
function saveLocal(){
  return idbSet(IDB_KEY, data).catch(err=>{
    console.error('Error saving to IndexedDB:', err);
    alert(`Your recipe book couldn't be saved (${err.name || 'error'}: ${err.message || 'unknown error'}). Please export a backup as soon as possible (Settings → Export data) so nothing is lost, and let me know what happened.`);
  });
}
function currentStorageSizeKB(){
  try{ return Math.round(new Blob([JSON.stringify(data)]).size / 1024); }
  catch(e){ return null; }
}
let saveDebounceTimer = null;
function flushSave(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = null;
  return saveLocal();
}
function markDirty(){
  dirty = true;
  const d = document.getElementById('dirtyDot');
  if(d) d.style.display = 'block';
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{ saveDebounceTimer = null; saveLocal(); }, 600);
}
function clearDirty(){
  dirty = false;
  const d = document.getElementById('dirtyDot');
  if(d) d.style.display = 'none';
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function removeAllModals(){
  document.querySelectorAll('.modal-backdrop').forEach(el=>{
    if(el.parentNode) el.parentNode.removeChild(el);
  });
}
function safeRemoveModal(el){
  if(el && el.parentNode) el.parentNode.removeChild(el);
}

/* =========================================================
   RECIPE FACTORY
========================================================= */
function blankRecipe(cat){
  return {
    id: uid(), name:"", categories: cat ? [cat] : [], images: [], description:"",
    sourceLines: [],
    referenceImages: [],
    sectionsEnabled: { storage:false, prepPlan:false, oven:false, equipment:false, source:false },
    storageLines: [], prepPlan: [],

    testing: false,
    quickNotes: []
  };
}

function coverImage(r){ return (r.images && r.images[0]) ? r.images[0].data : null; }

function makeInstructionGroup(){ return { id: uid(), name:'', items: [] }; }

function makeInstr(){ return { id: uid(), text:'', checked:false, images: [] }; }
function makePantryItem(cat){ return { id: uid(), name:'', type:'', category: cat||'', image:null, brands:[], stores:[], notes:'', price:'', quantity:'' }; }
function makeBrand(){ return { id: uid(), text:'' }; }
function makeStore(){ return { id: uid(), name:'', url:'' }; }
function migratePantryItem(raw){
  if(Array.isArray(raw.brands) && Array.isArray(raw.stores)){
    if(!('image' in raw)) raw.image = null;
    if(!('type' in raw)) raw.type = '';
    if(!('price' in raw)) raw.price = '';
    if(!('quantity' in raw)) raw.quantity = '';
    return raw;
  }
  const item = { id: raw.id||uid(), name: raw.name||'', type: raw.type||'', category: raw.category||'', image: raw.image||null, brands: [], stores: [], notes: raw.notes||'', price: raw.price||'', quantity: raw.quantity||'' };
  if(raw.brand) item.brands.push({ id: uid(), text: raw.brand });
  if(raw.link) item.stores.push({ id: uid(), name:'', url: raw.link });
  return item;
}
function makeEquipmentItem(cat){ return { id: uid(), name:'', type:'', category: cat||'', tags:[], image:null, brand:'', model:'', brands:[], stores:[], notes:'', price:'', quantity:'' }; }
function migrateEquipmentItem(raw){
  return {
    id: raw.id||uid(), name: raw.name||'', type: raw.type||'', category: raw.category||'',
    tags: Array.isArray(raw.tags) ? raw.tags : [],
    image: raw.image||null,
    brand: raw.brand || (Array.isArray(raw.brands) && raw.brands[0] ? raw.brands[0].text : '') || '',
    model: raw.model || '',
    brands: Array.isArray(raw.brands) ? raw.brands : [],
    stores: Array.isArray(raw.stores) ? raw.stores : [],
    notes: raw.notes||'', price: raw.price||'', quantity: raw.quantity||''
  };
}
function equipmentDisplayName(item){
  const parts = [];
  if(item.type) parts.push(item.type);
  if(item.model) parts.push(item.model);
  let name = parts.join(' ');
  if(item.brand){
    name = name ? `${name} (${item.brand})` : item.brand;
  }
  if(name) return name;
  if(item.name) return item.name;
  return 'Untitled';
}
function equipmentTagsBlockHTML(item, editing){
  if(editing){
    const chips = data.equipmentCategories.map(t=>{
      const sel = (item.tags||[]).includes(t);
      return `<button class="chip ${sel?'selected':''}" data-eqtag="${escAttr(t)}"><span class="dot" style="background:${sel?'':accentFor(t)}"></span>${escHtml(t)}</button>`;
    }).join('');
    return `<div class="chip-row" id="eqTagChipRow" style="margin-top:10px;">${chips}</div><button class="icon-btn" id="manageEqTagsFromItemBtn" style="margin-top:8px;" title="Manage equipment tags">⚙️ Manage tags</button>`;
  }
  const tags = item.tags || [];
  if(tags.length === 0) return '';
  const dots = tags.map(t=>`<span class="dot" style="background:${accentFor(t)}"></span>`).join('');
  return `<div class="tile-tags" style="margin-top:10px;">${dots}<span class="lbl">${escHtml(tags.join(' · '))}</span></div>`;
}

function resetRecipeChecks(r){
  if(!r) return;
  let changed = false;
  const resetGroups = (groups)=>{
    (groups||[]).forEach(g=>(g.items||[]).forEach(i=>{ if(i.checked){ i.checked = false; changed = true; } }));
  };
  resetGroups(r.ingredientGroups);
  resetGroups(r.instructionGroups);
  (r.variants||[]).forEach(v=>{
    resetGroups(v.ingredientGroups);
    resetGroups(v.instructionGroups);
  });
  if(changed) markDirty();
}
let lastViewedRecipeId = null;
function render(){
  const app = document.getElementById('app');
  if(state.view !== 'book' && wakeLockRef){
    wakeLockRef.release().catch(()=>{});
    wakeLockRef = null;
  }
  const currentBookRecipeId = (state.view === 'book' && state.bookOrder[state.bookIndex]) ? state.bookOrder[state.bookIndex].id : null;
  const enteringEditForSameRecipe = state.view === 'recipe' && state.recipeId === lastViewedRecipeId;
  if(lastViewedRecipeId && lastViewedRecipeId !== currentBookRecipeId && !enteringEditForSameRecipe){
    resetRecipeChecks(data.recipes.find(x=>x.id===lastViewedRecipeId));
    lastViewedRecipeId = null;
  }
  if(state.view === 'home'){
    app.innerHTML = homeHTML();
    attachHomeEvents();
  } else if(state.view === 'pantry'){
    renderPantryView();
  } else if(state.view === 'pantryItem'){
    renderPantryItemView();
  } else if(state.view === 'equipment'){
    renderEquipmentView();
  } else if(state.view === 'equipmentItem'){
    renderEquipmentItemView();
  } else if(state.view === 'archive'){
    renderArchiveView();
  } else if(state.view === 'shoppingList'){
    renderShoppingListView();
  } else if(state.view === 'bookToc'){
    renderBookTocView();
  } else if(state.view === 'book'){
    renderBookView();
    lastViewedRecipeId = currentBookRecipeId;
    if(!wakeLockRef && 'wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(wl=>{ wakeLockRef = wl; }).catch(()=>{});
    }
  } else {
    renderRecipeView();
  }
}

function tagsRowHTML(r){
  const tags = r.categories || [];
  if(tags.length === 0) return '';
  const dots = tags.map(t=>`<span class="dot" style="background:${accentFor(t)}"></span>`).join('');
  return `<div class="tile-tags">${dots}<span class="lbl">${escHtml(tags.join(' · '))}</span></div>`;
}
function recipeCoverImages(r){
  const covers = [];
  if(r.images && r.images[0]) covers.push(r.images[0].data);
  (r.variants||[]).forEach(v=>{
    if(covers.length >= 4) return;
    if(v.images && v.images[0]) covers.push(v.images[0].data);
  });
  return covers.slice(0,4);
}
function coverCollageHTML(r, baseClass){
  const covers = recipeCoverImages(r);
  if(covers.length === 0){
    return `<div class="${baseClass} placeholder">${ICON.image}</div>`;
  }
  if(covers.length === 1){
    return `<img class="${baseClass}" src="${covers[0]}" />`;
  }
  const layoutClass = covers.length === 2 ? 'cover-collage-2' : 'cover-collage-grid';
  return `<div class="${baseClass} cover-collage ${layoutClass}">${covers.map(c=>`<img src="${c}" />`).join('')}</div>`;
}
function tileHTML(r){
  return `<div class="tile" data-id="${r.id}">
    ${coverCollageHTML(r, 'tile-img')}
    <div class="tile-body">
      <div class="tile-name">${escHtml(r.name || 'Untitled')}${r.testing ? ` <span class="testing-badge">Testing</span>` : ''}</div>
      ${tagsRowHTML(r)}
    </div>
  </div>`;
}
function listRowHTML(r){
  return `<div class="list-row recipe-list-row" data-id="${r.id}">
    ${coverCollageHTML(r, 'list-thumb recipe-list-thumb')}
    <div class="list-info">
      <div class="list-name recipe-list-name">${escHtml(r.name || 'Untitled')}${r.testing ? ` <span class="testing-badge">Testing</span>` : ''}</div>
      ${tagsRowHTML(r)}
    </div>
  </div>`;
}

function addNewRecipe(){
  const cat = state.activeCategory !== "All" ? state.activeCategory : null;
  draftRecipe = blankRecipe(cat);
  state.recipeId = draftRecipe.id;
  state.isNew = true;
  state.isEditing = true;
  state.currentYield = null;
  state.currentMultiplier = null;
  state.view = 'recipe';
  render();
}
function openRecipe(id, origin){
  state.isNew = false;
  state.isEditing = false;
  state.editSnapshot = null;
  state.currentYield = null;
  state.currentMultiplier = null;
  state.recipeOrigin = origin || 'home';
  const r = data.recipes.find(x=>x.id===id);
  if(r) r.activeVariant = 'standard';
  setBookContext(id);
  state.view = 'book';
  render();
}

function openManageCategories(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Manage tags</h3>
      <div id="catList"></div>
      <div class="modal-add-row">
        <input type="text" id="newCatInput" placeholder="New tag name" />
        <button id="addCatBtn">Add</button>
      </div>
      <p class="hint">Deleting a tag removes it from any recipes that use it — their other tags are unaffected.</p>
      <button class="modal-close" id="closeModal">Done</button>
    </div>`;
  removeAllModals();
  document.body.appendChild(backdrop);

  function renderCatList(){
    const list = backdrop.querySelector('#catList');
    list.innerHTML = data.categories.map((c,i)=>`
      <div class="modal-row" data-idx="${i}">
        <span class="dot" style="background:${ACCENTS[i%ACCENTS.length]}"></span>
        <input type="text" value="${escAttr(c)}" data-idx="${i}" class="catRename" />
        <button class="catDelete" data-idx="${i}">${ICON.trash}</button>
      </div>`).join('');
    list.querySelectorAll('.catRename').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const idx = +e.target.dataset.idx;
        const oldName = data.categories[idx];
        const newName = e.target.value;
        data.categories[idx] = newName;
        data.recipes.forEach(r=>{
          if(Array.isArray(r.categories)){
            const ti = r.categories.indexOf(oldName);
            if(ti > -1) r.categories[ti] = newName;
          }
        });
        markDirty();
      });
    });
    list.querySelectorAll('.catDelete').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = +btn.dataset.idx;
        const removed = data.categories[idx];
        if(!confirm(`Delete the tag "${removed}"? This removes it from any recipes using it.`)) return;
        data.categories.splice(idx,1);
        data.recipes.forEach(r=>{
          if(Array.isArray(r.categories)) r.categories = r.categories.filter(t=>t!==removed);
        });
        if(state.activeCategory === removed) state.activeCategory = "All";
        markDirty();
        renderCatList();
      });
    });
  }
  renderCatList();

  backdrop.querySelector('#addCatBtn').addEventListener('click', ()=>{
    const input = backdrop.querySelector('#newCatInput');
    const val = input.value.trim();
    if(!val || data.categories.includes(val)){ input.value=''; return; }
    data.categories.push(val);
    markDirty();
    input.value = '';
    renderCatList();
  });
  backdrop.querySelector('#closeModal').addEventListener('click', ()=>{
    safeRemoveModal(backdrop);
    render();
  });
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop){ safeRemoveModal(backdrop); render(); } });
}

function handleEquipmentCancel(item){

  state.equipmentEditSnapshot = null;
  state.equipmentIsEditing = false;
  saveLocal();
  render();

function handleEquipmentSave(item){

    draftEquipmentItem = null;
    state.equipmentIsNew = false;
  }
  state.equipmentEditSnapshot = null;
  state.equipmentIsEditing = false;
  markDirty();
  flushSave();
  render();
}

========================================================= */
function computeBookChapters(){
  const visibleRecipes = data.recipes.filter(r=>!r.archived);
  const chapters = [];
  const usedIds = new Set();
  data.categories.forEach(tag=>{
    const recipesInChapter = visibleRecipes
      .filter(r => (r.categories && r.categories[0]) === tag)
      .sort((a,b)=>(a.name||'').localeCompare(b.name||'', undefined, {sensitivity:'base'}));
    if(recipesInChapter.length){
      chapters.push({ tag, recipes: recipesInChapter });
      recipesInChapter.forEach(r=> usedIds.add(r.id));
    }
  });
  const uncategorized = visibleRecipes
    .filter(r=>!usedIds.has(r.id))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'', undefined, {sensitivity:'base'}));
  if(uncategorized.length){
    chapters.push({ tag: 'Uncategorized', recipes: uncategorized });
  }
  return chapters;
}
function flattenBookOrder(chapters){
  const flat = [];
  chapters.forEach(ch=>{
    ch.recipes.forEach(r=> flat.push({ id: r.id, tag: ch.tag }));
  });
  return flat;
}
function setBookContext(recipeId){
  const flat = flattenBookOrder(computeBookChapters());
  let idx = flat.findIndex(x=>x.id===recipeId);
  if(idx === -1){
    const rec = data.recipes.find(x=>x.id===recipeId);
    state.bookOrder = [{ id: recipeId, tag: (rec && rec.archived) ? 'Archived' : 'Uncategorized' }];
    idx = 0;
  } else {
    state.bookOrder = flat;
  }
  state.bookIndex = Math.max(0, idx);
  state.recipeId = recipeId;
}
function openBookAt(recipeId){
  setBookContext(recipeId);
  state.recipeOrigin = 'bookToc';
  state.view = 'book';
  render();
}

          }).join('')}
        </ul>

  app.innerHTML = `

  document.querySelectorAll('.book-toc-item').forEach(el=>{

function bookNav(dir){
  const len = state.bookOrder.length;
  if(len === 0) return;
  state.bookIndex = (state.bookIndex + dir + len) % len;
  state.recipeId = state.bookOrder[state.bookIndex].id;
  render();
}
function wireBookSwipe(container){
  let startX = null, startY = null, startedInCarousel = false;
  container.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startedInCarousel = !!e.target.closest('.rv-carousel');
  }, {passive:true});
  container.addEventListener('touchend', e=>{
    if(startX === null || startedInCarousel){ startX = null; return; }
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5){
      bookNav(dx < 0 ? 1 : -1);
    }
    startX = null;
  }, {passive:true});
}
function renderBookView(){
  const app = document.getElementById('app');
  if(!state.bookOrder.length){ state.view = 'bookToc'; render(); return; }
  const entry = state.bookOrder[state.bookIndex];
  const r = data.recipes.find(x=>x.id===entry.id);
  if(!r){ state.view = 'bookToc'; render(); return; }
  const chapterEntries = state.bookOrder.filter(x=>x.tag===entry.tag);

function renderShoppingListView(){
  const app = document.getElementById('app');
  const items = data.shoppingList;

  function renderItemRow(item, pantryItem){
    const pantryStillExists = !!pantryItem;
    const nameHtml = pantryStillExists
      ? `<a class="pantry-link-ref shop-pantry-link" data-goto-pantry="${escAttr(item.pantryId)}">${escHtml(item.name)}</a>`
      : `<span>${escHtml(item.name)}</span>`;
    const thumb = (pantryItem && pantryItem.image)
      ? `<img class="shop-thumb" src="${pantryItem.image}" />`
      : `<div class="shop-thumb placeholder">${ICON.image}</div>`;
    return `
      <li class="shop-item">
        ${thumb}
        <button class="shop-check ${item.checked?'checked':''}" data-id="${item.id}">${ICON.check}</button>
        <span class="shop-line-text ${item.checked?'kitchen-done':''}">${nameHtml}</span>
        <button class="row-del shop-remove" data-id="${item.id}" title="Remove">${ICON.trash}</button>
      </li>`;
  }

  let bodyHtml;
  if(items.length === 0){
    bodyHtml = `<div class="empty">${ICON.book}<h3>Your list is empty</h3><p>Tap the cart icon on any pantry item to add it here.</p></div>`;
  } else {
    const groups = {};
    const ungrouped = [];
    items.forEach(item=>{
      const pantryItem = data.pantry.find(p=>p.id===item.pantryId);
      const cat = pantryItem ? (pantryItem.category||'') : '';
      if(!cat){ ungrouped.push({item, pantryItem}); }
      else{ (groups[cat] = groups[cat]||[]).push({item, pantryItem}); }
    });

    let html = '';
    Object.keys(groups).sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base'})).forEach(cat=>{
      html += `<div class="ing-group-label"><span class="dot shop-group-dot" style="background:${pantryAccentFor(cat)};"></span>${escHtml(cat)}</div>`;
      html += `<ul class="shop-list">${groups[cat].map(g=>renderItemRow(g.item, g.pantryItem)).join('')}</ul>`;
    });
    if(ungrouped.length){
      html += `<div class="ing-group-label">${Object.keys(groups).length ? 'Other' : ''}</div>`;
      html += `<ul class="shop-list">${ungrouped.map(g=>renderItemRow(g.item, g.pantryItem)).join('')}</ul>`;
    }
    html += `<button class="add-row-btn" id="clearCheckedBtn" style="margin-top:10px;">${ICON.trash} Clear checked items</button>`;
    bodyHtml = html;
  }

  app.innerHTML = `
    <div class="rv-header">
      <div class="rv-header-left"><button class="back-btn" id="shopBack">${ICON.back} Recipes</button></div>
      <div class="rv-header-right">
        <span style="font-family:var(--font-display);font-size:17px;">Shopping List</span>
        <button class="icon-btn" id="shopPantryBtn" title="Pantry">🧺</button>
      </div>
    </div>
    <div class="rv-body">
      ${bodyHtml}
    </div>
  `;

  document.getElementById('shopBack').addEventListener('click', ()=>{ state.viewMode='tile'; state.view='home'; render(); });
  document.getElementById('shopPantryBtn').addEventListener('click', ()=>{ state.view='pantry'; render(); });
  document.querySelectorAll('.shop-pantry-link').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      openPantryItem(el.dataset.gotoPantry);
    });
  });
  document.querySelectorAll('.shop-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = data.shoppingList.find(x=>x.id===btn.dataset.id);
      if(item){ item.checked = !item.checked; markDirty(); render(); }
    });
  });
  document.querySelectorAll('.shop-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = data.shoppingList.find(x=>x.id===btn.dataset.id);
      if(!confirm(`Remove "${item?item.name:'this item'}" from your shopping list?`)) return;
      data.shoppingList = data.shoppingList.filter(x=>x.id!==btn.dataset.id);
      markDirty();
      render();
    });
  });
  const clearBtn = document.getElementById('clearCheckedBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    const count = data.shoppingList.filter(x=>x.checked).length;
    if(count === 0) return;
    if(!confirm(`Remove ${count} checked item${count===1?'':'s'} from your shopping list?`)) return;
    data.shoppingList = data.shoppingList.filter(x=>!x.checked);
    markDirty();
    render();
  });
}

function handlePantryCancel(item){
  if(state.pantryIsNew){
    draftPantryItem = null;
    state.pantryIsNew = false;
    state.pantryIsEditing = false;
    state.view = 'pantry';
    render();
    return;
  }
  const idx = data.pantry.findIndex(x=>x.id===item.id);
  if(idx > -1 && state.pantryEditSnapshot) data.pantry[idx] = state.pantryEditSnapshot;
  state.pantryEditSnapshot = null;
  state.pantryIsEditing = false;
  saveLocal();
  render();
}
function handlePantrySave(item){
  if(state.pantryIsNew){
    data.pantry.push(item);
    draftPantryItem = null;
    state.pantryIsNew = false;
  }
  state.pantryEditSnapshot = null;
  state.pantryIsEditing = false;
  markDirty();
  flushSave();
  render();
}
function refreshPantryBody(item){
  try{
    renderPantryItemBody(item);
  }catch(err){
    console.error('Error refreshing pantry item body:', err);
    const container = document.getElementById('piBodyContainer');
    if(container){
      container.innerHTML = `<div class="empty"><h3>Something went wrong updating this item</h3><p>Your changes are safe. Use Save or Cancel above to continue, then let me know what you were doing so I can fix it.</p></div>`;
    }
  }

function imageBlockHTMLGeneric(obj, editing, wrapId){
  const inner = obj.image ? `<img src="${obj.image}" />` : `<div class="upload-hint">${ICON.camera}<span>${editing?'Add a photo':'No photo'}</span></div>`;
  const overlay = (editing && obj.image) ? `<span class="change-overlay">Change photo</span>` : '';
  const wrap = `<div class="rv-image-wrap ${editing?'editable':''}" id="${wrapId}">${inner}${overlay}</div>`;
  if(!editing) return wrap;
  const isLinked = obj.image && /^https?:\/\//i.test(obj.image);
  const linkRow = `
    <div class="image-link-row">
      <button class="image-link-toggle" id="${wrapId}_linkToggle" type="button">${ICON.link} ${isLinked ? 'Edit image link' : 'Or paste an image link'}</button>
      <div class="image-link-input-row" id="${wrapId}_linkInputRow" style="display:${isLinked ? 'flex' : 'none'};">
        <input type="text" class="image-link-input" id="${wrapId}_linkInput" placeholder="https://…" value="${isLinked ? escAttr(obj.image) : ''}" />
        <button class="text-btn primary" id="${wrapId}_linkUseBtn" type="button">Use</button>
      </div>
    </div>`;
  return wrap + linkRow;
}
function wireImageLinkToggle(obj, wrapId, refreshFn){
  const toggle = document.getElementById(`${wrapId}_linkToggle`);
  const inputRow = document.getElementById(`${wrapId}_linkInputRow`);
  const input = document.getElementById(`${wrapId}_linkInput`);
  const useBtn = document.getElementById(`${wrapId}_linkUseBtn`);
  if(!toggle || !inputRow || !input || !useBtn) return;
  toggle.addEventListener('click', ()=>{
    inputRow.style.display = inputRow.style.display === 'none' ? 'flex' : 'none';
    if(inputRow.style.display === 'flex') input.focus();
  });
  const applyLink = ()=>{
    const url = input.value.trim();
    if(!url) return;
    if(!/^https?:\/\//i.test(url)){
      alert('Please enter a full image link starting with http:// or https://');
      return;
    }
    obj.image = url;
    refreshFn();
  };
  useBtn.addEventListener('click', applyLink);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); applyLink(); } });
}
function wirePantryItemBody(item, editing){
  const wrap = document.getElementById('piImageWrap');
  const imgInput = document.getElementById('piImageInput');
  if(editing && wrap && imgInput){
    wrap.addEventListener('click', ()=> imgInput.click());
    imgInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const saveBtn = document.getElementById('piSave');
      if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Processing photo…'; }
      resizeImageToBase64(file, 1200, dataUrl=>{
        const btn = document.getElementById('piSave');
        if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
        if(!dataUrl){
          alert("This image couldn't be used — your browser may not support this file type (e.g. HEIC photos from an iPhone often need converting to JPEG or PNG first). Please try a different photo.");
          imgInput.value = '';
          return;
        }
        item.image = dataUrl;
        refreshPantryBody(item);
      });
    });
  }
  wireImageLinkToggle(item, 'piImageWrap', ()=> refreshPantryBody(item));

  if(editing){
    const nameInput = document.getElementById('piName');
    if(nameInput) nameInput.addEventListener('input', e=>{ item.name = e.target.value; });
    const typeInput = document.getElementById('piType');
    if(typeInput) typeInput.addEventListener('input', e=>{ item.type = e.target.value; });
    const priceInput = document.getElementById('piPrice');

      });
    });

    const addStoreBtn = document.getElementById('addStoreRow');
    if(addStoreBtn) addStoreBtn.addEventListener('click', ()=>{
      item.stores.push(makeStore());
      refreshPantryBody(item);
      focusLast('#storesList .pantry-store-name');
    });
    document.querySelectorAll('.pantry-store-name, .pantry-store-url').forEach(inp=>{
      const field = inp.classList.contains('pantry-store-name') ? 'name' : 'url';
      inp.addEventListener('input', e=>{
        const s = item.stores.find(x=>x.id===e.target.dataset.id);
        if(s) s[field] = e.target.value;
        if(field==='url'){
          const row = e.target.closest('.pantry-store-row');
          const openBtn = row && row.querySelector('.pantry-open-link');
          if(openBtn) openBtn.dataset.url = e.target.value;

      });

    document.querySelectorAll('#storesList .row-add[data-kind="store"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{

        refreshPantryBody(item);
      });
    });
    document.querySelectorAll('#storesList .row-del[data-kind="store"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        item.stores = item.stores.filter(x=>x.id!==btn.dataset.id);
        refreshPantryBody(item);
      });
    });
  }

  document.querySelectorAll('.pantry-open-link').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      let url = btn.dataset.url || '';
      if(!url) return;
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
