/* =========================================================
   RECIPE ACCESSORS
========================================================= */
function getRecipe(){
  if(state.isNew && draftRecipe) return draftRecipe;
  return data.recipes.find(r => r.id === state.recipeId);
}
function activeVariantObj(r){
  if(r.activeVariant === 'standard') return null;
  return (r.variants||[]).find(v=>v.id===r.activeVariant) || null;
}
function activeIngredientGroups(r){ const v = activeVariantObj(r); return v ? v.ingredientGroups : r.ingredientGroups; }
function flatIngredients(r){ return activeIngredientGroups(r).flatMap(g=>g.items); }
function activeInstructionGroups(r){ const v = activeVariantObj(r); return v ? v.instructionGroups : r.instructionGroups; }
function flatInstructions(r){ return activeInstructionGroups(r).flatMap(g=>g.items); }
function activeOvenRows(r){ const v = activeVariantObj(r); return v ? v.ovenRows : r.ovenRows; }
function activeEquipmentRows(r){ const v = activeVariantObj(r); return v ? v.equipmentRows : r.equipmentRows; }
function activeImages(r){ const v = activeVariantObj(r); return v ? v.images : r.images; }

function ensureYieldSession(r){
  if(state.currentYield === null || state.currentYield === undefined){
    state.currentYield = r.yield.base || 1;
  }
  return state.currentYield;
}
function ensureMultiplierSession(){
  if(state.currentMultiplier === null || state.currentMultiplier === undefined){
    state.currentMultiplier = 1;
  }
  return state.currentMultiplier;
}
function scaleFactor(r){
  if(!r.yield) return 1;
  if(r.yield.na) return ensureMultiplierSession();
  const base = r.yield.base || 1;
  const current = ensureYieldSession(r);
  return base === 0 ? 1 : (current / base);
}
function formatAmount(n){
  if(n === null || n === undefined || isNaN(n)) return '';
  const rounded = Math.round(n * 100) / 100;
  return rounded.toString();
}
const EXTERNAL_LINK_RE_SRC = '\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\s\\)]+)\\)';
function linkify(text){
  if(!text) return '';
  const COMBINED = new RegExp(EXTERNAL_LINK_RE_SRC + '|((https?:\\/\\/|www\\.)[^\\s]+)', 'g');
  let result = '';
  let lastIndex = 0;
  let match;
  while((match = COMBINED.exec(text)) !== null){
    result += escHtml(text.slice(lastIndex, match.index));
    if(match[1] !== undefined){
      result += `<a href="${escAttr(match[2])}" target="_blank" rel="noopener">${escHtml(match[1])}</a>`;
    } else {
      const raw = match[3];
      const href = raw.startsWith('http') ? raw : 'https://' + raw;
      result += `<a href="${escAttr(href)}" target="_blank" rel="noopener">${escHtml(raw)}</a>`;
    }
    lastIndex = COMBINED.lastIndex;
  }
  result += escHtml(text.slice(lastIndex));
  return result;
}

/* ---------- inline recipe links ---------- */
const RECIPE_LINK_RE = /\[\[([a-zA-Z0-9_]+):([^\]]*)\]\]/g;
const PANTRY_LINK_RE = /\{\{([a-zA-Z0-9_]+):([^\}]*)\}\}/g;
function parseRecipeLinks(text){
  if(!text) return '';
  let result = '';
  let lastIndex = 0;
  let match;
  RECIPE_LINK_RE.lastIndex = 0;
  while((match = RECIPE_LINK_RE.exec(text)) !== null){
    result += escHtml(text.slice(lastIndex, match.index));
    const targetId = match[1];
    const target = data.recipes.find(x=>x.id===targetId);
    if(target){
      result += `<a class="recipe-link" data-goto="${escAttr(targetId)}">${escHtml(target.name||'Untitled')}</a>`;
    } else {
      result += escHtml(match[2]);
    }
    lastIndex = RECIPE_LINK_RE.lastIndex;
  }
  result += escHtml(text.slice(lastIndex));
  return result;
}
function parseAllLinks(text){
  if(!text) return '';
  const COMBINED_RE = new RegExp('\\[\\[([a-zA-Z0-9_]+):([^\\]]*)\\]\\]|\\{\\{([a-zA-Z0-9_]+):([^\\}]*)\\}\\}|\\(\\(([a-zA-Z0-9_]+):([^\\)]*)\\)\\)|' + EXTERNAL_LINK_RE_SRC, 'g');
  let result = '';
  let lastIndex = 0;
  let match;
  while((match = COMBINED_RE.exec(text)) !== null){
    result += escHtml(text.slice(lastIndex, match.index));
    if(match[1] !== undefined){
      const targetId = match[1];
      const target = data.recipes.find(x=>x.id===targetId);
      if(target){
        result += `<a class="recipe-link" data-goto="${escAttr(targetId)}">${escHtml(target.name||'Untitled')}</a>`;
      } else {
        result += escHtml(match[2]);
      }
    } else if(match[3] !== undefined){
      const targetId = match[3];
      const target = data.pantry.find(x=>x.id===targetId);
      if(target){
        result += `<a class="pantry-link-ref" data-goto-pantry="${escAttr(targetId)}">${escHtml(target.name||'Untitled')}</a>`;
      } else {
        result += escHtml(match[4]);
      }
    } else if(match[5] !== undefined){
      const targetId = match[5];
      const target = data.equipment.find(x=>x.id===targetId);
      if(target){
        result += `<a class="equipment-link-ref" data-goto-equipment="${escAttr(targetId)}">${escHtml(equipmentDisplayName(target))}</a>`;
      } else {
        result += escHtml(match[6]);
      }
    } else {
      result += `<a href="${escAttr(match[8])}" target="_blank" rel="noopener">${escHtml(match[7])}</a>`;
    }
    lastIndex = COMBINED_RE.lastIndex;
  }
  result += escHtml(text.slice(lastIndex));
  return result;
}
function renderInstructionText(text){
  let html = parseAllLinks(text);
  html = html.replace(/\*\*([^\*]+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/\*([^\*]+?)\*/g, '<i>$1</i>');
  return html;
}
function recipeTextsFor(rec){
  const texts = [];
  texts.push(rec.description||'');
  (rec.ingredientGroups||[]).forEach(g=>(g.items||[]).forEach(i=>texts.push(i.name||'')));
  (rec.instructionGroups||[]).forEach(g=>(g.items||[]).forEach(i=>texts.push(i.text||'')));
  (rec.equipmentRows||[]).forEach(row=>texts.push(row.detail||''));
  (rec.variants||[]).forEach(v=>{
    (v.ingredientGroups||[]).forEach(g=>(g.items||[]).forEach(i=>texts.push(i.name||'')));
    (v.instructionGroups||[]).forEach(g=>(g.items||[]).forEach(i=>texts.push(i.text||'')));
    (v.equipmentRows||[]).forEach(row=>texts.push(row.detail||''));
  });
  return texts.join(' \n ');
}
function findLinkedFromRecipes(targetId){
  const found = [];
  data.recipes.forEach(rec=>{
    if(rec.id === targetId) return;
    if(recipeTextsFor(rec).includes(`[[${targetId}:`)) found.push(rec);
  });
  return found;
}

  const found = [];

function findRecipesLinkingToEquipment(equipId){

function insertTokenIntoField(inputEl, token){
  const start = inputEl.selectionStart != null ? inputEl.selectionStart : inputEl.value.length;
  const end = inputEl.selectionEnd != null ? inputEl.selectionEnd : inputEl.value.length;
  const before = inputEl.value.slice(0, start);
  const after = inputEl.value.slice(end);
  inputEl.value = before + token + after;
  const newPos = start + token.length;
  inputEl.focus();
  if(inputEl.setSelectionRange) inputEl.setSelectionRange(newPos, newPos);
  inputEl.dispatchEvent(new Event('input', {bubbles:true}));
}
function insertRecipeLinkIntoField(inputEl, recipeId, recipeName){
  insertTokenIntoField(inputEl, `[[${recipeId}:${recipeName}]]`);
}
function insertPantryLinkIntoField(inputEl, pantryId, pantryName){
  insertTokenIntoField(inputEl, `{{${pantryId}:${pantryName}}}`);
}
function insertEquipmentLinkIntoField(inputEl, equipId, equipName){
  insertTokenIntoField(inputEl, `((${equipId}:${equipName}))`);
}
function insertExternalLinkIntoField(inputEl, label, url){
  insertTokenIntoField(inputEl, `[${label}](${url})`);
}

        <input type="text" class="picker-search" id="linkPickerExtUrl" placeholder="https://…" style="margin-bottom:6px;" />
        <button id="linkPickerExtInsert">Insert link</button>
      </div>
      <div id="linkPickerList"></div>
      <button class="modal-close" id="closeLinkPicker">Cancel</button>
    </div>`;
  document.body.appendChild(backdrop);

  function renderResults(query){
    const list = backdrop.querySelector('#linkPickerList');
    const q = (query||'').trim().toLowerCase();
    const recipeOptions = data.recipes.filter(rec => rec.id !== currentRecipeId && (!q || (rec.name||'').toLowerCase().includes(q)));
    const pantryOptions = data.pantry.filter(p => p.id !== currentPantryId && (!q || (p.name||'').toLowerCase().includes(q)));
    const equipmentOptions = data.equipment.filter(eq => eq.id !== currentEquipmentId && (!q || equipmentDisplayName(eq).toLowerCase().includes(q)));
    if(recipeOptions.length === 0 && pantryOptions.length === 0 && equipmentOptions.length === 0){
      list.innerHTML = `<div class="picker-empty">No matches</div>`;
      return;
    }
    let html = '';
    if(recipeOptions.length){
      html += `<div class="picker-group-label">Recipes</div>` + recipeOptions.map(rec=>`<div class="picker-item" data-kind="recipe" data-id="${rec.id}" data-name="${escAttr(rec.name||'Untitled')}">${escHtml(rec.name||'Untitled')}</div>`).join('');
    }
    if(pantryOptions.length){
      html += `<div class="picker-group-label">Pantry items</div>` + pantryOptions.map(p=>`<div class="picker-item" data-kind="pantry" data-id="${p.id}" data-name="${escAttr(p.name||'Untitled')}">${escHtml(p.name||'Untitled')}</div>`).join('');
    }
    if(equipmentOptions.length){
      html += `<div class="picker-group-label">Equipment</div>` + equipmentOptions.map(eq=>`<div class="picker-item" data-kind="equipment" data-id="${eq.id}" data-name="${escAttr(equipmentDisplayName(eq))}">${escHtml(equipmentDisplayName(eq))}</div>`).join('');
    }
    list.innerHTML = html;
    list.querySelectorAll('.picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        if(item.dataset.kind === 'pantry'){
          insertPantryLinkIntoField(targetEl, item.dataset.id, item.dataset.name);
        } else if(item.dataset.kind === 'equipment'){
          insertEquipmentLinkIntoField(targetEl, item.dataset.id, item.dataset.name);
        } else {
          insertRecipeLinkIntoField(targetEl, item.dataset.id, item.dataset.name);
        }
        safeRemoveModal(backdrop);
        if(typeof onInsert === 'function') onInsert();
      });
    });
  }
  renderResults('');
  backdrop.querySelector('#linkPickerSearch').addEventListener('input', e=> renderResults(e.target.value));
  backdrop.querySelector('#linkPickerExternalToggle').addEventListener('click', ()=>{
    const form = backdrop.querySelector('#linkPickerExternalForm');
    const showing = form.style.display !== 'none';
    form.style.display = showing ? 'none' : 'block';
    if(!showing) backdrop.querySelector('#linkPickerExtLabel').focus();
  });
  backdrop.querySelector('#linkPickerExtInsert').addEventListener('click', ()=>{
    const label = backdrop.querySelector('#linkPickerExtLabel').value.trim();
    let url = backdrop.querySelector('#linkPickerExtUrl').value.trim();
    if(!label || !url){ alert('Please enter both a label and a URL.'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    insertExternalLinkIntoField(targetEl, label, url);
    safeRemoveModal(backdrop);
    if(typeof onInsert === 'function') onInsert();
  });
  backdrop.querySelector('#closeLinkPicker').addEventListener('click', ()=> safeRemoveModal(backdrop));
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) safeRemoveModal(backdrop); });
}

/* =========================================================
   RECIPE VIEW — ROOT RENDER
========================================================= */
function renderRecipeView(){
  const r = getRecipe();
  const app = document.getElementById('app');
  if(!r){ state.viewMode='tile'; state.view='home'; render(); return; }

  const editing = state.isEditing;
  const backLabel = state.recipeOrigin === 'archive' ? 'Archive' : 'Recipes';

  app.innerHTML = `
    <div class="rv-header">
      <div class="rv-header-left">
        ${editing
          ? `<button class="text-btn" id="rvCancel">Cancel</button>`
          : `<button class="back-btn" id="rvBack">${ICON.back} ${backLabel}</button>`
        }
      </div>
      <div class="rv-header-right">
        ${editing
          ? `<button class="text-btn primary" id="rvSave">Save</button>`
          : `
            <button class="icon-btn" id="rvDuplicate" title="Duplicate">${ICON.copy}</button>
            <button class="icon-btn" id="rvEdit" title="Edit">${ICON.edit}</button>
            <button class="icon-btn danger" id="rvDelete" title="Delete">${ICON.trash}</button>
            <button class="icon-btn" id="rvSettings" title="Settings">⚙️</button>
          `
        }
      </div>
    </div>
    <div class="rv-body" id="rvBodyContainer"></div>
  `;

  // Wire header controls FIRST, before rendering the (larger, riskier) body —
  // so Save/Cancel/Back always work even if something below fails to render.
  if(editing){
    document.getElementById('rvCancel').addEventListener('click', ()=> handleCancel(r));
    document.getElementById('rvSave').addEventListener('click', ()=> handleSave(r));
  } else {
    document.getElementById('rvBack').addEventListener('click', ()=>{
      const dest = state.recipeOrigin === 'archive' ? 'archive' : 'home';
      if(dest === 'home') state.viewMode = 'tile';
      state.view = dest;
      render();
    });
    document.getElementById('rvDuplicate').addEventListener('click', ()=> duplicateRecipe(r));
    document.getElementById('rvSettings').addEventListener('click', ()=> openRecipeSettingsMenu(r));
    document.getElementById('rvEdit').addEventListener('click', ()=> handleEdit(r));
    document.getElementById('rvDelete').addEventListener('click', ()=> handleDelete(r));
  }

  try{
    renderRecipeBody(r);
  }catch(err){
    console.error('Error rendering recipe body:', err);
    const container = document.getElementById('rvBodyContainer');
    if(container){
      container.innerHTML = `<div class="empty"><h3>Something went wrong displaying this recipe</h3><p>Your changes are safe. Use ${editing?'Save or Cancel':'Back'} above to continue, then let me know what you were doing so I can fix it.</p></div>`;
    }
  }
}
function openRecipeSettingsMenu(r){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Settings</h3>
      <div class="settings-menu">
        <button class="settings-menu-item" id="menuDuplicate">${ICON.copy} Duplicate</button>
        <button class="settings-menu-item" id="menuPrint">${ICON.print} Print</button>
        <button class="settings-menu-item" id="menuTestingToggle">${r.testing?ICON.check:'🧪'} ${r.testing?'Mark as Tested':'Mark as Testing'}</button>
        <button class="settings-menu-item" id="menuArchiveToggle">${r.archived?ICON.restore:ICON.archive} ${r.archived?'Restore from archive':'Archive this recipe'}</button>
        <button class="settings-menu-item danger" id="menuDelete">${ICON.trash} Delete this recipe</button>
      </div>
      <button class="modal-close" id="closeRecipeSettingsMenu">Close</button>
    </div>`;
  removeAllModals();
  document.body.appendChild(backdrop);
  function close(){ safeRemoveModal(backdrop); }
  backdrop.querySelector('#menuDuplicate').addEventListener('click', ()=>{ close(); duplicateRecipe(r); });
  backdrop.querySelector('#menuPrint').addEventListener('click', ()=>{ close(); openPrintPreview(r); });
  backdrop.querySelector('#menuTestingToggle').addEventListener('click', ()=>{ close(); handleToggleTesting(r); });
  backdrop.querySelector('#menuArchiveToggle').addEventListener('click', ()=>{ close(); handleToggleArchive(r); });
  backdrop.querySelector('#menuDelete').addEventListener('click', ()=>{ close(); handleDelete(r); });
  backdrop.querySelector('#closeRecipeSettingsMenu').addEventListener('click', close);
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
}
function handleToggleTesting(r){
  r.testing = !r.testing;
  markDirty();
  render();
}
function handleToggleArchive(r){
  r.archived = !r.archived;
  markDirty();
  state.viewMode = 'tile';
    state.view = 'home';
  render();
}

function handleEdit(r){
  state.editSnapshot = deepClone(r);
  state.isEditing = true;
  state.view = 'recipe';
  render();
}
function handleCancel(r){
  if(state.isNew){
    draftRecipe = null;
    state.isNew = false;
    state.isEditing = false;
    state.viewMode = 'tile';
    state.view = 'home';
    render();
    return;
  }
  const idx = data.recipes.findIndex(x=>x.id===r.id);
  if(idx > -1 && state.editSnapshot){
    data.recipes[idx] = state.editSnapshot;
  }
  state.editSnapshot = null;
  state.isEditing = false;
  state.currentYield = null;
  state.currentMultiplier = null;
  saveLocal();
  setBookContext(r.id);
  state.view = 'book';
  render();
}
function handleSave(r){
  if(state.isNew){
    data.recipes.push(r);
    draftRecipe = null;
    state.isNew = false;
  }
  state.editSnapshot = null;
  state.isEditing = false;
  markDirty();
  flushSave();
  setBookContext(r.id);
  state.view = 'book';
  render();
}
function handleDelete(r){
  if(confirm('Delete this recipe? This cannot be undone.')){
    data.recipes = data.recipes.filter(x=>x.id!==r.id);
    markDirty();
    state.viewMode = 'tile';
    state.view = 'home';
    render();
  }
}
function duplicateRecipe(r){
  if(!confirm(`Duplicate "${r.name || 'Untitled'}"? This will create a new editable copy.`)) return;
  const clone = deepClone(r);
  clone.id = uid();
  clone.name = 'Copy of ' + (r.name || 'Untitled');
  clone.archived = false;
  clone.quickNotes = [];
  clone.images = (clone.images||[]).map(img=>({...img, id: uid()}));
  clone.ingredientGroups = clone.ingredientGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid()}))}));
  clone.instructionGroups = clone.instructionGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid(), images:(i.images||[]).map(img=>({...img,id:uid()}))}))}));
  clone.storageLines = clone.storageLines.map(i=>({...i, id: uid()}));
  clone.prepPlan = clone.prepPlan.map(i=>({...i, id: uid()}));
  clone.sourceLines = (clone.sourceLines||[]).map(i=>({...i, id: uid()}));
  clone.ovenRows = (clone.ovenRows||[]).map(i=>({...i, id: uid()}));
  clone.equipmentRows = (clone.equipmentRows||[]).map(i=>({...i, id: uid()}));
  clone.referenceImages = (clone.referenceImages||[]).map(i=>({...i, id: uid()}));
  clone.variants = (clone.variants||[]).map(v=>({
    ...v, id: uid(),
    images: (v.images||[]).map(img=>({...img, id: uid()})),
    ingredientGroups: v.ingredientGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid()}))})),
    instructionGroups: v.instructionGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid()}))})),
    ovenRows: (v.ovenRows||[]).map(i=>({...i, id: uid()})),
    equipmentRows: (v.equipmentRows||[]).map(i=>({...i, id: uid()}))
  }));
  clone.activeVariant = 'standard';
  data.recipes.push(clone);
  markDirty();
  state.recipeId = clone.id;
  state.isNew = false;
  state.editSnapshot = deepClone(clone);
  state.isEditing = true;
  state.currentYield = null;
  state.currentMultiplier = null;
  state.view = 'recipe';
  render();
}

/* =========================================================
   RECIPE BODY (shared render target re-rendered on structural change)
========================================================= */
function renderRecipeBody(r){
  const container = document.getElementById('rvBodyContainer');
  const editing = state.isEditing;
  const variant = activeVariantObj(r);

  container.innerHTML = `
    ${(editing && state.isNew) ? `<div class="quickfill-row">
      <button id="pasteTextBtn">📋 Paste text</button>
      <button id="scanPhotoBtn">📷 Scan a photo</button>
    </div>` : ''}
    ${imageBlockHTML(r, editing)}
    <input type="file" accept="image/*" id="rvImageInput" style="display:none" />

    ${editing
      ? `<input class="rv-title" id="rvTitle" placeholder="Recipe title" value="${escAttr(r.name)}" />`
      : `<div class="rv-title-static">${escHtml(r.name || 'Untitled')}</div>${variant?`<div class="rv-variant-sub">${escHtml(variant.name)} variant</div>`:''}`
    }

    ${tagsBlockHTML(r, editing)}

    ${editing
      ? `<div class="field-with-link" style="margin-top:16px;">
           <textarea class="rv-desc" id="rvDesc" style="margin-top:0;" placeholder="A short description of this recipe…">${escHtml(r.description)}</textarea>
           <button class="link-insert-btn" data-target="rvDesc" title="Link to a recipe">${ICON.link}</button>
         </div>`
      : (r.description ? `<div class="rv-desc-static">${renderInstructionText(r.description)}</div>` : '')
    }

    ${editing ? optionalChipsHTML(r) : ''}

    ${(r.sectionsEnabled.prepPlan) ? sectionHTML('prep','Preparation plan', prepPlanBodyHTML(r, editing), editing) : ''}

    <div class="yv-strip">
      ${yieldRowHTML(r, editing)}
      ${variantRowHTML(r, editing)}
    </div>

    ${sectionHTML('ingredients','Ingredients', ingredientsBodyHTML(r, editing), false)}
    ${sectionHTML('instructions','Instructions', instructionsBodyHTML(r, editing), false)}
    ${(r.sectionsEnabled.storage) ? sectionHTML('storage','Storage instructions', storageBodyHTML(r, editing), editing) : ''}
    ${(r.sectionsEnabled.source) ? sectionHTML('source','Source', sourceSectionBodyHTML(r, editing), editing) : ''}

    ${referenceRowHTML(r)}
    ${linkedFromHTML(r)}
  `;

  wireImage(r);
  if(editing){
    wireTitleTagsDesc(r);
    wireOptionalChips(r);
    const pasteBtn = document.getElementById('pasteTextBtn');
    if(pasteBtn) pasteBtn.addEventListener('click', ()=> openPasteTextModal(r));
    const scanBtn = document.getElementById('scanPhotoBtn');
    if(scanBtn) scanBtn.addEventListener('click', ()=> openScanPhotoFlow(r));
  }
  wireSectionToggles();
  wireStorage(r, editing);
  wirePrepPlan(r, editing);
  wireYieldAndVariant(r, editing);
  wireIngredients(r, editing);
  wireInstructions(r, editing);
  wireSourceSection(r, editing);
  wireReferenceRow(r, editing);
  wireRecipeLinkButtons(r);
  wireRecipeLinkClicks(container);
  autosizeAll();
}

function refreshBody(r){
  try{
    if(state.view === 'book'){
      renderBookPages(r);
    } else {
      renderRecipeBody(r);
    }
  }catch(err){
    console.error('Error refreshing recipe body:', err);
    const container = document.getElementById('rvBodyContainer') || document.getElementById('bookSpread');
    if(container){
      container.innerHTML = `<div class="empty"><h3>Something went wrong updating this recipe</h3><p>Your changes are safe. Use Save or Cancel above to continue, then let me know what you were doing so I can fix it.</p></div>`;
    }
  }
}

/* ---------- image ---------- */
function imageBlockHTML(r, editing){
  const images = activeImages(r) || [];
  if(images.length === 0 && !editing){
    return `<div class="rv-image-wrap"><div class="upload-hint">${ICON.camera}<span>No photo</span></div></div>`;
  }
  if(images.length === 0 && editing){
    return `<div class="rv-image-wrap editable" id="rvImageWrap"><div class="upload-hint">${ICON.camera}<span>Add photo</span></div></div>`;
  }
  const slides = images.map(img => `
    <div class="rv-carousel-slide">
      <img src="${img.data}" ${!editing ? `class="rv-carousel-img-enlargeable" data-lightbox-src="${escAttr(img.data)}"` : ''} />
      ${editing ? `<button class="carousel-del" data-id="${img.id}" title="Remove photo">${ICON.trash}</button>` : ''}
    </div>`).join('');
  const dots = images.length > 1 ? `<div class="rv-carousel-dots" id="rvCarouselDots">${images.map((_,i)=>`<span class="rv-dot ${i===0?'active':''}" data-idx="${i}"></span>`).join('')}</div>` : '';
  const addBtn = editing ? `<button class="add-row-btn" id="rvImageWrap" style="margin-top:8px;">${ICON.plus} Add photo</button>` : '';
  return `<div class="rv-carousel-outer">
    <div class="rv-carousel" id="rvCarousel">${slides}</div>
    ${dots}
    ${addBtn}
  </div>`;
}
function wireCarouselDots(carouselId, dotsId){
  const carousel = document.getElementById(carouselId);
  const dotsContainer = document.getElementById(dotsId);
  if(!carousel || !dotsContainer) return;
  const dots = dotsContainer.querySelectorAll('.rv-dot');
  carousel.addEventListener('scroll', ()=>{
    const idx = Math.round(carousel.scrollLeft / Math.max(1,carousel.clientWidth));
    dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
  });
  dots.forEach((d,i)=>{
    d.addEventListener('click', ()=>{
      carousel.scrollTo({ left: i * carousel.clientWidth, behavior:'smooth' });
    });
  });
}
function wireImage(r){
  wireCarouselDots('rvCarousel', 'rvCarouselDots');
  document.querySelectorAll('.rv-carousel-img-enlargeable[data-lightbox-src]').forEach(img=>{
    img.addEventListener('click', ()=> openReferenceLightbox(img.dataset.lightboxSrc));
  });
  if(!state.isEditing) return;
  const wrap = document.getElementById('rvImageWrap');
  const input = document.getElementById('rvImageInput');
  if(wrap) wrap.addEventListener('click', ()=> input.click());
  input.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const saveBtn = document.getElementById('rvSave');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Processing photo…'; }
    resizeImageToBase64(file, 1200, dataUrl=>{
      const btn = document.getElementById('rvSave');
      if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
      if(!dataUrl){
        alert("This image couldn't be used — your browser may not support this file type (e.g. HEIC photos from an iPhone often need converting to JPEG or PNG first). Please try a different photo.");
        input.value = '';
        return;
      }
      const v = activeVariantObj(r);
      const target = v || r;
      target.images = target.images || [];
      target.images.push(makeRecipeImage(dataUrl));
      input.value = '';
      refreshBody(r);
    });
  });
  document.querySelectorAll('.carousel-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('Remove this photo?')) return;
      const v = activeVariantObj(r);
      const target = v || r;
      target.images = target.images.filter(x=>x.id!==btn.dataset.id);
      refreshBody(r);
    });
  });
}

/* ---------- tags ---------- */
function tagsBlockHTML(r, editing){
  if(!editing){
    return '';
  }
  const chips = data.categories.map(c=>{
    const sel = (r.categories||[]).includes(c);
    return `<button class="chip ${sel?'selected':''}" data-tag="${escAttr(c)}"><span class="dot" style="background:${sel?'':accentFor(c)}"></span>${escHtml(c)}</button>`;
  }).join('');
  return `<div class="chip-row" id="tagChipRow">${chips}</div>`;
}
function wireTitleTagsDesc(r){
  document.getElementById('rvTitle').addEventListener('input', e=>{ r.name = e.target.value; });
  const desc = document.getElementById('rvDesc');
  desc.addEventListener('input', e=>{ r.description = e.target.value; autosize(e.target); });
  const tagRow = document.getElementById('tagChipRow');
  if(tagRow){
    tagRow.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const tag = chip.dataset.tag;
        r.categories = r.categories || [];
        const idx = r.categories.indexOf(tag);
        if(idx > -1) r.categories.splice(idx,1); else r.categories.push(tag);
        refreshBody(r);
      });
    });
  }
}

/* ---------- optional section chips ---------- */
function optionalChipsHTML(r){
  const opts = [
    {key:'storage', label:'Storage instructions'},
    {key:'prepPlan', label:'Preparation plan'},
    {key:'oven', label:'Oven details'},
    {key:'equipment', label:'Equipment'},
    {key:'source', label:'Source'}
  ].filter(o => !r.sectionsEnabled[o.key]);
  if(opts.length === 0) return '';
  return `<div class="optional-section-chips">
    ${opts.map(o=>`<button data-enable="${o.key}">${ICON.plus} ${o.label}</button>`).join('')}
  </div>`;
}
function wireOptionalChips(r){
  document.querySelectorAll('[data-enable]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      r.sectionsEnabled[btn.dataset.enable] = true;
      if(btn.dataset.enable === 'storage' && r.storageLines.length===0) r.storageLines.push(makeLine());
      if(btn.dataset.enable === 'prepPlan' && r.prepPlan.length===0) r.prepPlan.push(makeLine());
      if(btn.dataset.enable === 'source' && r.sourceLines.length===0) r.sourceLines.push(makeLine());
      state.openSections[btn.dataset.enable==='prepPlan'?'prep':btn.dataset.enable] = true;
      refreshBody(r);
    });
  });
}

/* ---------- generic section shell ---------- */
function sectionHTML(key, label, innerHTML, removable){
  const open = state.openSections[key];
  return `
    <div class="section">
      <div class="section-head" data-section="${key}">
        <div class="section-head-left"><h4>${label}</h4></div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${removable ? `<button class="section-remove" data-remove="${key==='prep'?'prepPlan':key}">×</button>` : ''}
          <span class="${open?'chev open':'chev'}">${ICON.chev}</span>
        </div>
      </div>
      <div class="section-body ${open?'open':''}" data-sectionbody="${key}">
        <div class="section-body-inner">${innerHTML}</div>
      </div>
    </div>`;
}
function wireSectionToggles(){
  document.querySelectorAll('.section-head').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.section-remove')) return;
      const key = head.dataset.section;
      state.openSections[key] = !state.openSections[key];
      const body = document.querySelector(`[data-sectionbody="${key}"]`);
      const chev = head.querySelector('.chev');
      body.classList.toggle('open');
      chev.classList.toggle('open');
    });
  });
  document.querySelectorAll('.section-remove').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const r = getRecipe();
      r.sectionsEnabled[btn.dataset.remove] = false;
      refreshBody(r);
    });
  });
}

/* ---------- storage ---------- */
function storageBodyHTML(r, editing){
  if(!editing){
    return `<ul class="line-list">${r.storageLines.map(l=>`<li class="line-item"><div class="line-text-static">${escHtml(l.text)}</div></li>`).join('')}</ul>`;
  }
  const rows = r.storageLines.map(l => `
    <li class="line-item" data-id="${l.id}">
      <input class="line-text" data-id="${l.id}" placeholder="e.g. Keeps refrigerated for up to 3 days" value="${escAttr(l.text)}" />
      <div class="row-actions">
        <button class="row-add" data-kind="storage" data-id="${l.id}">${ICON.plus}</button>
        <button class="row-del" data-kind="storage" data-id="${l.id}">${ICON.trash}</button>
      </div>
    </li>`).join('');
  return `<ul class="line-list" id="storageList">${rows}</ul>
    <button class="add-row-btn" id="addStorageRow">${ICON.plus} Add line</button>`;
}
function wireStorage(r, editing){
  if(!editing) return;
  const addBtn = document.getElementById('addStorageRow');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    r.storageLines.push(makeLine());
    refreshBody(r);
    focusLast('#storageList .line-text');
  });
  document.querySelectorAll('#storageList .line-text').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const item = r.storageLines.find(x=>x.id===e.target.dataset.id);
      if(item) item.text = e.target.value;
    });
  });
  document.querySelectorAll('#storageList .row-add[data-kind="storage"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = r.storageLines.findIndex(x=>x.id===btn.dataset.id);
      r.storageLines.splice(idx+1, 0, makeLine());
      refreshBody(r);
    });
  });
  document.querySelectorAll('#storageList .row-del[data-kind="storage"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      r.storageLines = r.storageLines.filter(x=>x.id!==btn.dataset.id);
      refreshBody(r);
    });
  });
}

/* ---------- prep plan ---------- */
function prepPlanBodyHTML(r, editing){
  if(!editing){
    return `<ul class="prep-list">${r.prepPlan.map(item=>`<li class="prep-item"><div class="line-text-static">${escHtml(item.text)}</div></li>`).join('')}</ul>`;
  }
  const rows = r.prepPlan.map(item => `
    <li class="prep-item" data-id="${item.id}">

    return `<div class="yield-row"><span class="yield-static">Makes <b>${current}</b> ${escHtml(y.unit)}</span>
      <div class="stepper" id="yieldStepper">

function variantRowHTML(r, editing){
  const hasVariants = (r.variants||[]).length > 0;
  const pills = [];
  if(hasVariants){
    pills.push(`<button class="variant-pill ${r.activeVariant==='standard'?'active':''}" data-variant="standard">Standard</button>`);
    pills.push(...(r.variants||[]).map(v=>{
      const isActive = r.activeVariant === v.id;
      const pill = `<button class="variant-pill ${isActive?'active':''}" data-variant="${v.id}">${escHtml(v.name)}</button>`;
      const renameBtn = (isActive && editing) ? `<button class="variant-rename-btn" data-id="${v.id}" title="Rename variant">✏️</button>` : '';

function openVariantRenamePrompt(r, variantId){
  const v = (r.variants||[]).find(x=>x.id===variantId);

      <div class="modal-add-row"><button id="saveVariantRenameBtn" style="flex:1;">Save</button></div>

function wireYieldAndVariant(r, editing){
  const stepper = document.getElementById('yieldStepper');
  if(stepper){
    stepper.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dir = +btn.dataset.dir;
        state.currentYield = Math.max(1, ensureYieldSession(r) + dir);
        refreshBody(r);
      });
    });
  }
  const resetBtn = document.getElementById('yieldReset');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    state.currentYield = r.yield.base || 1;
    refreshBody(r);
  });
  const multStepper = document.getElementById('multiplierStepper');
  if(multStepper){
    multStepper.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dir = +btn.dataset.dir;
        state.currentMultiplier = Math.max(0.5, ensureMultiplierSession() + dir);
        refreshBody(r);
      });
    });
  }
  const multReset = document.getElementById('multiplierReset');
  if(multReset) multReset.addEventListener('click', ()=>{
    state.currentMultiplier = 1;
    refreshBody(r);
  });
  const naToggle = document.getElementById('yieldNaToggle');
  if(naToggle) naToggle.addEventListener('change', e=>{

  });
  if(editing){
    const baseInput = document.getElementById('yieldBase');
    if(baseInput) baseInput.addEventListener('input', e=>{

      r.yield.base = newBase;
      state.currentYield = newBase;
    });
    const unitInput = document.getElementById('yieldUnit');
    if(unitInput) unitInput.addEventListener('input', e=>{ r.yield.unit = e.target.value; });

  }
  document.querySelectorAll('.variant-pill[data-variant]').forEach(btn=>{

      r.activeVariant = btn.dataset.variant;
      refreshBody(r);
    });
  });

    btn.addEventListener('click', (e)=>{

}

function openManageVariants(r){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Manage variants</h3>
      <div id="varList"></div>
      <div class="modal-add-row">
        <input type="text" id="newVarInput" placeholder="e.g. Chocolate, Lemon…" />
        <button id="addVarBtn">Add</button>
      </div>
      <p class="hint">A new variant starts as a full copy of the Standard ingredients, instructions, and oven details — edit it independently from there.</p>
      <button class="modal-close" id="closeVarModal">Done</button>
    </div>`;
  removeAllModals();
  document.body.appendChild(backdrop);

  function renderVarList(){
    const list = backdrop.querySelector('#varList');
    let html = `<div class="modal-row"><span class="fixed-label">Standard (base recipe)</span></div>`;
    html += (r.variants||[]).map(v=>`
      <div class="modal-row" data-id="${v.id}">
        <input type="text" value="${escAttr(v.name)}" data-id="${v.id}" class="varRename" />
        <button class="varDelete" data-id="${v.id}">${ICON.trash}</button>
      </div>`).join('');
    list.innerHTML = html;
    list.querySelectorAll('.varRename').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const v = r.variants.find(x=>x.id===e.target.dataset.id);
        if(v) v.name = e.target.value;
      });
    });
    list.querySelectorAll('.varDelete').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const v = r.variants.find(x=>x.id===btn.dataset.id);
        if(!confirm(`Delete the "${v?v.name:'this'}" variant? Its own ingredients and instructions will be lost — the base recipe is unaffected.`)) return;
        r.variants = r.variants.filter(x=>x.id!==btn.dataset.id);
        if(r.activeVariant === btn.dataset.id) r.activeVariant = 'standard';
        renderVarList();
      });
    });
  }
  renderVarList();

  backdrop.querySelector('#addVarBtn').addEventListener('click', ()=>{
    const input = backdrop.querySelector('#newVarInput');
    const val = input.value.trim();
    if(!val) return;
    const v = {
      id: uid(), name: val,
      images: (r.images||[]).map(img=>({...img, id: uid()})),
      ingredientGroups: r.ingredientGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid()}))})),
      instructionGroups: r.instructionGroups.map(g=>({...g, id: uid(), items: g.items.map(i=>({...i, id: uid(), images:(i.images||[]).map(img=>({...img,id:uid()}))}))})),
      ovenRows: r.ovenRows.map(row=>({...row, id: uid()})),
      equipmentRows: r.equipmentRows.map(row=>({...row, id: uid()}))
    };
    r.variants.push(v);
    input.value = '';
    renderVarList();
  });
  backdrop.querySelector('#closeVarModal').addEventListener('click', ()=>{
    safeRemoveModal(backdrop);
    refreshBody(r);
  });
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop){ safeRemoveModal(backdrop); refreshBody(r); } });
}

/* ---------- ingredients ---------- */
function ingredientsBodyHTML(r, editing){
  const groups = activeIngredientGroups(r);
  const factor = scaleFactor(r);
  const showGroupNames = groups.length > 1;

  const renderGroup = (group) => {
    const list = group.items;
    if(!editing){
      const renderItem = (item) => {
        const amt = item.amount !== null && item.amount !== '' && !isNaN(item.amount) ? formatAmount(item.amount * factor) : '';
        return `<li class="ing-item">
          <button class="ing-check ${item.checked?'checked':''}" data-id="${item.id}">${ICON.check}</button>
          <div class="ing-static">${amt?`<span class="amt ing-static-name${item.checked?' checked':''}">${escHtml(amt)}${item.unit?' '+escHtml(item.unit):''}</span> `:''}<span class="ing-static-name${item.checked?' checked':''}">${parseAllLinks(item.name)}</span></div>
        </li>`;
      };
      const required = list.filter(i=>!i.optional);
      const optional = list.filter(i=>i.optional);
      let html = showGroupNames ? `<div class="ing-group-label">${escHtml(group.name||'Untitled')}</div>` : '';
      html += `<ul class="ing-list">${required.map(renderItem).join('')}</ul>`;
      if(optional.length){
        html += `<div class="pantry-sublabel" style="margin-top:14px;">Optional</div><ul class="ing-list">${optional.map(renderItem).join('')}</ul>`;
      }
      return html;
    }
    const rows = list.map(item => `
      <li class="ing-item" data-id="${item.id}">
        <button class="ing-check ${item.checked?'checked':''}" data-id="${item.id}">${ICON.check}</button>
        <div class="ing-fields">
          <input class="ing-amt" data-id="${item.id}" data-field="amount" type="text" inputmode="decimal" placeholder="amt" value="${item.amount===null?'':escAttr(String(item.amount))}" />
          <input class="ing-unit" data-id="${item.id}" data-field="unit" placeholder="unit" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" value="${escAttr(item.unit)}" />
          <div class="field-with-link">
            <input class="ing-name" id="ingname_${item.id}" data-id="${item.id}" data-field="name" placeholder="ingredient" value="${escAttr(item.name)}" />
            <button class="link-insert-btn" data-target="ingname_${item.id}" title="Link to a recipe">${ICON.link}</button>
          </div>
        </div>
        <div class="row-actions">
          <button class="opt-toggle-btn ${item.optional?'active':''}" data-kind="ing" data-id="${item.id}" title="Mark as optional">Opt</button>
          <button class="row-add" data-kind="ing" data-id="${item.id}">${ICON.plus}</button>
          <button class="row-del" data-kind="ing" data-id="${item.id}">${ICON.trash}</button>
        </div>
      </li>`).join('');
    const groupHeader = showGroupNames ? `
      <div class="ing-group-header">
        <input type="text" class="ing-group-name-input" data-group="${group.id}" placeholder="Component name" value="${escAttr(group.name)}" />
        <button class="row-del ing-group-del" data-group="${group.id}" title="Remove this list">${ICON.trash}</button>
      </div>` : '';
    return `${groupHeader}
      <ul class="ing-list" data-group="${group.id}">${rows}</ul>
      <button class="add-row-btn addIngRowBtn" data-group="${group.id}">${ICON.plus} Add ingredient</button>`;
  };

  let html = groups.map(renderGroup).join(editing ? '<div style="height:6px"></div>' : '<div style="height:4px"></div>');
  if(editing){
    html += `<button class="add-row-btn" id="addIngGroupBtn" style="margin-top:12px;">${ICON.plus} Add ingredient list</button>`;
  }
  return html;
}
function wireIngredients(r, editing){
  const groups = activeIngredientGroups(r);
  function findItemAndGroup(id){
    for(const g of groups){
      const item = g.items.find(x=>x.id===id);
      if(item) return { item, group: g };
    }
    return { item: null, group: null };
  }
  document.querySelectorAll('.ing-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { item } = findItemAndGroup(btn.dataset.id);
      if(item){ item.checked = !item.checked; refreshBody(r); }
    });
  });
  if(!editing) return;
  document.querySelectorAll('.addIngRowBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = groups.find(g=>g.id===btn.dataset.group);
      if(group){
        group.items.push(makeIngredient());
        refreshBody(r);
        focusLast(`.ing-list[data-group="${group.id}"] .ing-name`);
      }
    });
  });
  document.querySelectorAll('.ing-list input[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const { item } = findItemAndGroup(e.target.dataset.id);
      if(!item) return;
      const field = e.target.dataset.field;
      if(field === 'amount'){
        const v = e.target.value.trim();
        item.amount = v === '' ? null : parseAmountInput(v);
      } else {
        item[field] = e.target.value;
      }
    });
  });
  document.querySelectorAll('.opt-toggle-btn[data-kind="ing"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { item } = findItemAndGroup(btn.dataset.id);
      if(item){ item.optional = !item.optional; refreshBody(r); }
    });
  });
  document.querySelectorAll('.row-add[data-kind="ing"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { group } = findItemAndGroup(btn.dataset.id);
      if(group){
        const idx = group.items.findIndex(x=>x.id===btn.dataset.id);
        group.items.splice(idx+1, 0, makeIngredient());
        refreshBody(r);
      }
    });
  });
  document.querySelectorAll('.row-del[data-kind="ing"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { group } = findItemAndGroup(btn.dataset.id);
      if(group){
        const idx = group.items.findIndex(x=>x.id===btn.dataset.id);
        if(idx>-1) group.items.splice(idx,1);
        refreshBody(r);
      }
    });
  });
  document.querySelectorAll('.ing-group-name-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const g = groups.find(x=>x.id===e.target.dataset.group);
      if(g) g.name = e.target.value;
    });
  });
  document.querySelectorAll('.ing-group-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(groups.length <= 1) return;
      const idx = groups.findIndex(g=>g.id===btn.dataset.group);
      if(idx<0) return;
      const g = groups[idx];
      if(!confirm(`Delete the "${g.name||'Untitled'}" ingredient list and all ${g.items.length} item(s) in it?`)) return;
      groups.splice(idx,1);
      refreshBody(r);
    });
  });
  const addGroupBtn = document.getElementById('addIngGroupBtn');
  if(addGroupBtn) addGroupBtn.addEventListener('click', ()=>{
    groups.push(makeIngredientGroup());
    refreshBody(r);
  });
}

/* ---------- instructions ---------- */
function ovenBlockHTML(r, editing){
  if(!r.sectionsEnabled.oven) return '';
  const rows = activeOvenRows(r);
  const showLabels = rows.length > 1;

  if(!editing){
    const rowsHtml = rows.map(oven=>{
      const parts = [];
      if(oven.temp) parts.push(`<div><b>Oven temp</b>${oven.temp}°${oven.tempUnit}</div>`);
      const settingLabel = oven.setting === 'Other' ? (oven.settingOther||'Other') : oven.setting;
      if(settingLabel) parts.push(`<div><b>Oven function</b>${escHtml(settingLabel)}</div>`);
      if(oven.time) parts.push(`<div><b>Bake time</b>${escHtml(String(oven.time))} ${oven.timeUnit}</div>`);
      if(parts.length===0) return '';
      const label = (showLabels && oven.label) ? `<div class="oven-row-label">${escHtml(oven.label)}</div>` : '';
      return `<div class="oven-row-group">${label}<div class="oven-static">${parts.join('')}</div></div>`;
    }).join('');
    return rowsHtml ? `<div id="ovenStaticWrap"><div class="linked-from-label settings-block-title">Oven settings</div>${rowsHtml}</div>` : '';
  }

  const rowsHtml = rows.map((oven,idx)=>`
    <div class="oven-row-edit" data-id="${oven.id}">
      ${showLabels ? `<div class="oven-field" style="flex-basis:100%;"><label>Component label</label><input type="text" class="ovenLabelInput" data-id="${oven.id}" placeholder="e.g. Feuilletine" value="${escAttr(oven.label)}" /></div>` : ''}
      <div class="oven-field">
        <label>Oven temp</label>
        <div class="row">
          <input type="number" class="ovenTempInput" data-id="${oven.id}" value="${oven.temp===null?'':oven.temp}" />
          <div class="unit-toggle tempUnitToggle" data-id="${oven.id}">
            <button data-val="C" class="${oven.tempUnit==='C'?'active':''}">°C</button>
            <button data-val="F" class="${oven.tempUnit==='F'?'active':''}">°F</button>
          </div>
        </div>
      </div>
      <div class="oven-field">
        <label>Oven function</label>
        <select class="ovenSettingSelect" data-id="${oven.id}">
          ${OVEN_SETTINGS.map(s=>`<option value="${s}" ${oven.setting===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      ${oven.setting==='Other' ? `<div class="oven-field"><label>Describe</label><input type="text" class="ovenOtherInput" data-id="${oven.id}" value="${escAttr(oven.settingOther)}" placeholder="e.g. Convection roast" /></div>` : ''}
      <div class="oven-field">
        <label>Bake time</label>
        <div class="row">
          <input type="text" class="ovenTimeInput" data-id="${oven.id}" placeholder="e.g. 10-15" value="${oven.time===null?'':escAttr(String(oven.time))}" style="width:74px;" />
          <div class="unit-toggle timeUnitToggle" data-id="${oven.id}">
            <button data-val="min" class="${oven.timeUnit==='min'?'active':''}">min</button>
            <button data-val="hr" class="${oven.timeUnit==='hr'?'active':''}">hr</button>
          </div>
        </div>
      </div>
      <button class="row-del ovenRowDel" data-id="${oven.id}" title="Remove this oven setting">${ICON.trash}</button>
    </div>`).join('');

  return `<div id="ovenBlock">${rowsHtml}
    <button class="add-row-btn" id="addOvenRowBtn">${ICON.plus} Add oven setting</button>
  </div>`;
}

function applyInlineFormat(el, marker){
  const start = el.selectionStart, end = el.selectionEnd;
  if(start === end) return;
  const before = el.value.slice(0, start);
  const selected = el.value.slice(start, end);
  const after = el.value.slice(end);
  el.value = before + marker + selected + marker + after;
  el.dispatchEvent(new Event('input', {bubbles:true}));
  el.focus();
  el.setSelectionRange(start, start + marker.length*2 + selected.length);
}
function wireFormatToolbar(item){
  const ta = document.getElementById(`instrtext_${item.id}`);
  const toolbar = document.getElementById(`fmttoolbar_${item.id}`);
  if(!ta || !toolbar) return;
  const checkSelection = ()=>{
    if(ta.selectionStart !== ta.selectionEnd){ toolbar.style.display = 'flex'; }
    else { toolbar.style.display = 'none'; }
  };
  ta.addEventListener('mouseup', checkSelection);
  ta.addEventListener('touchend', checkSelection);
  ta.addEventListener('keyup', checkSelection);
  ta.addEventListener('blur', ()=>{ setTimeout(()=>{ toolbar.style.display = 'none'; }, 150); });
  toolbar.querySelectorAll('button[data-fmt]').forEach(btn=>{
    btn.addEventListener('mousedown', e=> e.preventDefault());
    btn.addEventListener('click', ()=>{
      applyInlineFormat(ta, btn.dataset.fmt);
      toolbar.style.display = 'none';
    });
  });
}
function wireInstructions(r, editing){
  wireOvenBlock(r, editing);
  wireEquipmentBlock(r, editing);
  document.querySelectorAll('.instr-photo-thumb[data-lightbox-src]').forEach(img=>{
    img.addEventListener('click', ()=> openReferenceLightbox(img.dataset.lightboxSrc));
  });
  document.querySelectorAll('.instr-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = flatInstructions(r).find(x=>x.id===btn.dataset.id);
      if(item){ item.checked = !item.checked; markDirty(); refreshBody(r); }
    });
  });
  if(!editing) return;
  const groups = activeInstructionGroups(r);
  function findItemAndGroup(id){
    for(const g of groups){
      const item = g.items.find(x=>x.id===id);
      if(item) return { item, group: g };
    }
    return { item: null, group: null };
  }
  document.querySelectorAll('.addInstrRowBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = groups.find(g=>g.id===btn.dataset.group);
      if(group){
        group.items.push(makeInstr());
        refreshBody(r);
        focusLast(`.instr-list[data-group="${group.id}"] .instr-text`);
      }
    });
  });
  document.querySelectorAll('.instr-text').forEach(ta=>{
    autosize(ta);
    ta.addEventListener('input', e=>{
      const { item } = findItemAndGroup(e.target.dataset.id);
      if(item) item.text = e.target.value;
      autosize(e.target);
    });
  });
  groups.forEach(g => g.items.forEach(item => wireFormatToolbar(item)));
  document.querySelectorAll('.row-add[data-kind="instr"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { group } = findItemAndGroup(btn.dataset.id);
      if(group){
        const idx = group.items.findIndex(x=>x.id===btn.dataset.id);
        group.items.splice(idx+1, 0, makeInstr());
        refreshBody(r);
        focusLast(`.instr-list[data-group="${group.id}"] .instr-text`);
      }
    });
  });
  document.querySelectorAll('.row-del[data-kind="instr"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { group } = findItemAndGroup(btn.dataset.id);
      if(group){
        const idx = group.items.findIndex(x=>x.id===btn.dataset.id);
        if(idx>-1) group.items.splice(idx,1);
        refreshBody(r);
      }
    });
  });
  document.querySelectorAll('.instr-group-name-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const g = groups.find(x=>x.id===e.target.dataset.group);
      if(g) g.name = e.target.value;
    });
  });
  document.querySelectorAll('.instr-group-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(groups.length <= 1) return;
      const idx = groups.findIndex(g=>g.id===btn.dataset.group);
      if(idx<0) return;
      const g = groups[idx];
      if(!confirm(`Delete the "${g.name||'Untitled'}" instruction list and all ${g.items.length} step(s) in it?`)) return;
      groups.splice(idx,1);
      refreshBody(r);
    });
  });
  const addGroupBtn = document.getElementById('addInstrGroupBtn');
  if(addGroupBtn) addGroupBtn.addEventListener('click', ()=>{
    groups.push(makeInstructionGroup());
    refreshBody(r);
  });
  document.querySelectorAll('.instr-photo-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.querySelector(`.instr-photo-input[data-id="${btn.dataset.id}"]`);
      if(input) input.click();
    });
  });
  document.querySelectorAll('.instr-photo-input').forEach(input=>{
    input.addEventListener('change', e=>{
      const files = Array.from(e.target.files || []);
      if(files.length === 0) return;
      const { item } = findItemAndGroup(input.dataset.id);
      if(!item) return;
      let remaining = files.length;
      let failures = 0;
      files.forEach(file=>{
        resizeImageToBase64(file, 1200, dataUrl=>{
          if(dataUrl){
            item.images = item.images || [];
            item.images.push(makeRecipeImage(dataUrl));
          } else {
            failures++;
          }
          remaining--;
          if(remaining === 0){
            input.value = '';
            refreshBody(r);
            if(failures > 0){
              alert(`${failures} image${failures===1?'':'s'} couldn't be used — your browser may not support that file type (e.g. HEIC photos from an iPhone often need converting to JPEG or PNG first).`);
            }
          }
        });
      });
    });
  });
  document.querySelectorAll('.instr-photo-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { item } = findItemAndGroup(btn.dataset.stepid);
      if(!item) return;
      if(!confirm('Remove this photo?')) return;
      item.images = (item.images||[]).filter(x=>x.id!==btn.dataset.imgid);
      refreshBody(r);
    });
  });
}

function extractLinkChips(text){
  if(!text) return [];
  const chips = [];
  const RE = new RegExp('\\[\\[([a-zA-Z0-9_]+):([^\\]]*)\\]\\]|\\{\\{([a-zA-Z0-9_]+):([^\\}]*)\\}\\}|' + EXTERNAL_LINK_RE_SRC, 'g');
  let m;
  while((m = RE.exec(text))){
    if(m[1] !== undefined){
      const rec = data.recipes.find(x=>x.id===m[1]);
      chips.push({ kind:'recipe', id:m[1], name: rec ? (rec.name||'Untitled') : m[2] });
    } else if(m[3] !== undefined){
      const p = data.pantry.find(x=>x.id===m[3]);
      chips.push({ kind:'pantry', id:m[3], name: p ? (p.name||'Untitled') : m[4] });
    } else {
      chips.push({ kind:'external', id: m[6], name: m[5] });
    }
  }
  return chips;
}
function openReferenceGallery(r, editing){
  removeAllModals();
  const overlay = document.createElement('div');
  overlay.className = 'modal-backdrop';
  overlay.id = 'referenceOverlay';

  function bodyHTML(){
    if(r.referenceImages.length === 0){
      return `<div class="picker-empty">No reference images yet.</div>`;
    }
    return `<div class="reference-grid">${r.referenceImages.map(img=>`
      <div class="reference-thumb-wrap" data-id="${img.id}">
        <img class="reference-thumb" src="${img.data}" data-id="${img.id}" />
        ${editing ? `<button class="reference-remove" data-id="${img.id}">${ICON.trash}</button>` : ''}
      </div>`).join('')}</div>`;
  }

  overlay.innerHTML = `
    <div class="modal" style="max-width:520px;">
      <h3>Reference images</h3>
      <div id="referenceGalleryBody">${bodyHTML()}</div>
      ${editing ? `<div class="modal-add-row"><button id="addReferenceBtn" style="flex:1;">${ICON.plus} Add image</button></div><input type="file" id="referenceFileInput" accept="image/*" multiple style="display:none" />` : ''}
      <button class="modal-close" id="closeReferenceModal">Close</button>
    </div>`;
  document.body.appendChild(overlay);

  function refreshGallery(){
    document.getElementById('referenceGalleryBody').innerHTML = bodyHTML();
    wireGalleryButtons();
  }
  function wireGalleryButtons(){
    document.querySelectorAll('.reference-thumb').forEach(img=>{
      img.addEventListener('click', ()=> openReferenceLightbox(img.src));
    });
    document.querySelectorAll('.reference-remove').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(!confirm('Delete this reference image?')) return;
        r.referenceImages = r.referenceImages.filter(x=>x.id!==btn.dataset.id);
        markDirty();
        refreshGallery();
        const mainRefBtn = document.getElementById('referenceBtn');
        if(mainRefBtn) mainRefBtn.textContent = `📎 Reference${r.referenceImages.length ? ` (${r.referenceImages.length})` : ''}`;
      });
    });
  }
  wireGalleryButtons();

  if(editing){
    document.getElementById('addReferenceBtn').addEventListener('click', ()=>{
      document.getElementById('referenceFileInput').click();
    });
    document.getElementById('referenceFileInput').addEventListener('change', e=>{
      const files = Array.from(e.target.files || []);
      let remaining = files.length;
      let failures = 0;
      if(remaining === 0) return;
      files.forEach(file=>{
        resizeImageToBase64(file, 1600, dataUrl=>{
          if(dataUrl){
            r.referenceImages.push({ id: uid(), data: dataUrl });
            markDirty();
          } else {
            failures++;
          }
          remaining--;
          if(remaining === 0){
            refreshGallery();
            const mainRefBtn = document.getElementById('referenceBtn');
            if(mainRefBtn) mainRefBtn.textContent = `📎 Reference${r.referenceImages.length ? ` (${r.referenceImages.length})` : ''}`;
            if(failures > 0){
              alert(`${failures} image${failures===1?'':'s'} couldn't be used — your browser may not support that file type (e.g. HEIC photos from an iPhone often need converting to JPEG or PNG first).`);
            }
          }
        });
      });
    });
  }

  document.getElementById('closeReferenceModal').addEventListener('click', ()=>{
    safeRemoveModal(overlay);
  });
  overlay.addEventListener('click', e=>{ if(e.target === overlay) safeRemoveModal(overlay); });
}

/* =========================================================
   IMAGE RESIZE
========================================================= */
function resizeImageToBase64(file, maxDim, cb){
  resizeViaObjectUrl(file, maxDim, result=>{
    if(result){ cb(result); return; }
    // Fallback path: some files (notably certain HEIC photos) fail to load via
    // an object URL in some contexts but succeed when read as a data URL instead.
    resizeViaFileReader(file, maxDim, cb);
  });
}
function resizeViaObjectUrl(file, maxDim, cb){
  let settled = false;
  let objectUrl = null;
  const finish = (result)=>{
    if(settled) return;
    settled = true;
    clearTimeout(safetyTimer);
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    cb(result);
  };
  const safetyTimer = setTimeout(()=> finish(null), 15000);

  try{
    objectUrl = URL.createObjectURL(file);
  }catch(err){
    console.error('Error creating object URL for image:', err);
    finish(null);
    return;
  }

  const img = new Image();
  img.onerror = ()=> finish(null);
  img.onload = ()=>{
    try{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      finish(canvas.toDataURL('image/jpeg', 0.85));
    }catch(err){
      console.error('Error processing image:', err);
      finish(null);
    }
  };
  img.src = objectUrl;
}
function resizeViaFileReader(file, maxDim, cb){
  let settled = false;
  const finish = (result)=>{
    if(settled) return;
    settled = true;
    clearTimeout(safetyTimer);
    cb(result);
  };
  const safetyTimer = setTimeout(()=> finish(null), 15000);

  const reader = new FileReader();
  reader.onerror = ()=> finish(null);
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> finish(null);
    img.onload = ()=>{
      try{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        finish(canvas.toDataURL('image/jpeg', 0.85));
      }catch(err){
        console.error('Error processing image (FileReader fallback):', err);
        finish(null);
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

   IMPORT / EXPORT  (with schema migration)
========================================================= */
function migrateRecipe(raw){
  const base = blankRecipe(null);
  const r = Object.assign({}, base, raw);
  // categories: migrate old single `category` string
  if(!Array.isArray(raw.categories)){
    r.categories = raw.category ? [raw.category] : [];
  }
  // storage: migrate old string `storage` to storageLines
  if(!Array.isArray(raw.storageLines)){
    r.storageLines = raw.storage ? [{id:uid(), text: raw.storage}] : [];
    if(r.storageLines.length) r.sectionsEnabled = Object.assign({}, r.sectionsEnabled, {storage:true});
  }
  if(!Array.isArray(r.prepPlan)) r.prepPlan = [];
  else if(raw.prepPlan && raw.prepPlan.length) r.sectionsEnabled = Object.assign({}, r.sectionsEnabled, {prepPlan:true});
  function normalizeIngItem(i){
    if('name' in i) return { optional:false, checked:false, ...i };
    return { id: i.id||uid(), amount:null, unit:'', name: i.text||'', checked: !!i.checked, optional:false };
  }
  if(Array.isArray(raw.ingredientGroups)){
    r.ingredientGroups = raw.ingredientGroups.map(g=>({
      id: g.id||uid(), name: g.name||'',
      items: (g.items||[]).map(normalizeIngItem)
    }));
  } else {
    r.ingredientGroups = [{ id: uid(), name:'', items: (raw.ingredients||[]).map(normalizeIngItem) }];
  }
  if(Array.isArray(raw.instructionGroups)){
    r.instructionGroups = raw.instructionGroups.map(g=>({
      id: g.id||uid(), name: g.name||'',
      items: (g.items||[]).map(i=>({ checked:false, images:[], ...i }))
    }));
  } else {
    r.instructionGroups = [{ id: uid(), name:'', items: (raw.instructions||[]).map(i=>({ checked:false, images:[], ...i })) }];
  }
  if(!r.yield) r.yield = { base:4, unit:'servings', na:false };
  if(typeof r.yield.na !== 'boolean') r.yield.na = false;
  if(!r.yield.base) r.yield.base = 4;
  if(!r.sectionsEnabled) r.sectionsEnabled = { storage:false, prepPlan:false, oven:false, equipment:false, source:false };
  if(typeof r.sectionsEnabled.source !== 'boolean') r.sectionsEnabled.source = false;
  if(typeof r.sectionsEnabled.equipment !== 'boolean') r.sectionsEnabled.equipment = false;
  // oven: migrate old single `oven` object to `ovenRows` array
  if(!Array.isArray(raw.ovenRows)){
    if(raw.oven && (raw.oven.temp || raw.oven.time || raw.oven.setting)){
      r.ovenRows = [{ id: uid(), label:'', ...raw.oven }];
      r.sectionsEnabled.oven = true;
    } else {
      r.ovenRows = [makeOvenRow()];
    }
  }
  if(!Array.isArray(raw.equipmentRows)){
    r.equipmentRows = [makeEquipmentRow()];
  }
  if(!Array.isArray(r.variants)) r.variants = [];
  r.variants = r.variants.map(v=>{
    if(!Array.isArray(v.ovenRows)){
      v.ovenRows = (v.oven && (v.oven.temp || v.oven.time || v.oven.setting))
        ? [{ id: uid(), label:'', ...v.oven }]
        : [makeOvenRow()];
    }
    delete v.oven;
    if(!Array.isArray(v.equipmentRows)) v.equipmentRows = [makeEquipmentRow()];
    if(!Array.isArray(v.ingredientGroups)){
      v.ingredientGroups = [{ id: uid(), name:'', items: (v.ingredients||[]).map(normalizeIngItem) }];
    }
    delete v.ingredients;
    if(!Array.isArray(v.instructionGroups)){
      v.instructionGroups = [{ id: uid(), name:'', items: (v.instructions||[]).map(i=>({ checked:false, images:[], ...i })) }];
    }
    delete v.instructions;
    if(!Array.isArray(v.images)) v.images = [];
    return v;
  });
  if(!r.activeVariant) r.activeVariant = 'standard';
  // source: migrate old single string `source` to sourceLines array
  if(!Array.isArray(raw.sourceLines)){
    r.sourceLines = (typeof raw.source === 'string' && raw.source) ? [{id:uid(), text: raw.source}] : [];
    if(r.sourceLines.length) r.sectionsEnabled.source = true;
  }
  if(!Array.isArray(r.referenceImages)) r.referenceImages = [];
  if(typeof r.archived !== 'boolean') r.archived = false;
  if(typeof r.testing !== 'boolean') r.testing = false;
  if(!Array.isArray(r.quickNotes)) r.quickNotes = [];
  r.quickNotes = r.quickNotes.map(n=>({ images:[], ...n }));
  if(!Array.isArray(raw.images)){
    r.images = raw.image ? [{ id: uid(), data: raw.image }] : [];
  }
  return r;
}

function measureTextWidth(text, font){
  try{
    const canvas = measureTextWidth._canvas || (measureTextWidth._canvas = document.createElement('canvas'));
    const ctx = canvas.getContext('2d');
    if(!ctx) return (text||'').length * 11;
    ctx.font = font;
    return ctx.measureText(text || '').width;
  }catch(e){
    return (text||'').length * 11;
  }
}
function resizeTitleInput(input){

/* =========================================================
   RECIPE TEXT PARSER (shared by Paste text & Scan a photo)
========================================================= */
const FRACTION_MAP = {'¼':0.25,'½':0.5,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅕':0.2,'⅖':0.4,'⅗':0.6,'⅘':0.8,'⅙':1/6,'⅚':5/6,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
const FRAC_CLASS = '¼½¾⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞';
function parseAmountInput(v){
  v = v.trim();
  let m = v.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(m){ const den = Number(m[3]); return den ? Number(m[1]) + Number(m[2])/den : Number(m[1]); }
  m = v.match(/^(\d+)\/(\d+)$/);
  if(m){ const den = Number(m[2]); return den ? Number(m[1])/den : null; }
  const amt = parseFloat(v.replace(',', '.'));
  return isNaN(amt) ? null : amt;
}
function extractIngredientAmount(line){
  let m = line.match(new RegExp(`^(\\d+)\\s*\\+\\s*([${FRAC_CLASS}])\\s*([a-zA-Zµ]*)\\.?\\s+(.*)$`));
  if(m) return { amount: parseFloat(m[1]) + FRACTION_MAP[m[2]], unit: m[3]||'', name: m[4].trim() };
  m = line.match(new RegExp(`^(\\d+)\\s+([${FRAC_CLASS}])\\s*([a-zA-Zµ]*)\\.?\\s+(.*)$`));
  if(m) return { amount: parseFloat(m[1]) + FRACTION_MAP[m[2]], unit: m[3]||'', name: m[4].trim() };
  m = line.match(new RegExp(`^([${FRAC_CLASS}])\\s*([a-zA-Zµ]*)\\.?\\s+(.*)$`));
  if(m) return { amount: FRACTION_MAP[m[1]], unit: m[2]||'', name: m[3].trim() };
  m = line.match(/^(\d+)\/(\d+)\s*([a-zA-Zµ]*)\.?\s+(.*)$/);
  if(m){ const den = Number(m[2]); return { amount: den ? Number(m[1])/den : null, unit: m[3]||'', name: m[4].trim() }; }
  m = line.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Zµ]*)\.?\s+(.*)$/);
  if(m){ const amt = parseFloat(m[1].replace(',','.')); return { amount: isNaN(amt)?null:amt, unit: m[2]||'', name: m[3].trim() }; }
  return null;
}
function parseRecipeText(text){
  const rawLines = text.split(/\r?\n/).map(l=>l.trim());
  const stripMd = s => s.replace(/^\*+|\*+$/g,'').trim();
  const ingredientsHeaderRe = /^ingredients?\b/i;
  const instructionsHeaderRe = /^(instructions?|directions?|method|steps|preparation)\b/i;
  const isBulletLine = l => /^[-*•●▪️○\u2022]\s*/.test(l);
  const isNumberedLine = l => /^\d+[\.\)]\s*/.test(l) || /^step\s*\d+[:.]?/i.test(l);
  const startsWithQty = l => new RegExp(`^[\\d${FRAC_CLASS}]`).test(l.replace(/^[-*•●▪️○\u2022]\s*/,''));
  const isSentenceShaped = l => /[.!?]$/.test(l) && l.split(/\s+/).length >= 4;
  const isShortLabelLine = l => !!l && l.split(/\s+/).length <= 4 && !/[.!?]$/.test(l);
  const isIngredientShaped = l => {
    if(isNumberedLine(l)) return false;
    if(isBulletLine(l) || startsWithQty(l)) return true;
    return !isSentenceShaped(l) && l.split(/\s+/).length <= 6;
  };

  let ingIdx=-1, instrIdx=-1;
  rawLines.forEach((l,i)=>{
    const t = stripMd(l);
    if(ingIdx===-1 && ingredientsHeaderRe.test(t)) ingIdx=i;
    if(instrIdx===-1 && instructionsHeaderRe.test(t)) instrIdx=i;
  });

  function scanIngredientBlock(from, hardEnd){
    let i = from;
    let labelCount = 0;
    while(i < hardEnd){
      const line = rawLines[i];
      if(!line){ i++; continue; }
      if(isNumberedLine(line)) break;
      const isDirectIngredient = isBulletLine(line) || startsWithQty(line);
      if(isDirectIngredient){ i++; continue; }
      const next = rawLines.slice(i+1, hardEnd).find(l=>l);
      if(isShortLabelLine(line) && next && (isBulletLine(next) || startsWithQty(next))){ labelCount++; i++; continue; }
      if(isIngredientShaped(line)){ i++; continue; }
      break;
    }
    return { end: i, labelCount };
  }
  function findIngredientStart(from, hardEnd){
    for(let i=from; i<hardEnd; i++){
      const line = rawLines[i];
      if(!line) continue;
      if(isIngredientShaped(line)) return i;
      const next = rawLines.slice(i+1, hardEnd).find(l=>l);
      if(isShortLabelLine(line) && next && (isBulletLine(next) || isIngredientShaped(next))) return i;
      return -1; // first non-empty content line doesn't look like an ingredient — bail
    }
    return -1;
  }
  function absorbLeadingLabel(idx, scanResult){
    if(scanResult.labelCount < 1) return idx;
    let j = idx - 1;
    while(j >= 0 && !rawLines[j]) j--;
    if(j >= 0 && isShortLabelLine(rawLines[j])) return j;
    return idx;
  }

  let titleEndIdx, ingStart=-1, ingEnd=-1, instrStart=-1;

  if(ingIdx !== -1 && instrIdx !== -1 && instrIdx > ingIdx){
    titleEndIdx = ingIdx;
    ingStart = ingIdx+1; ingEnd = instrIdx;
    instrStart = instrIdx+1;
  } else if(ingIdx !== -1){
    titleEndIdx = ingIdx;
    ingStart = ingIdx+1;
    ingEnd = scanIngredientBlock(ingStart, rawLines.length).end;
    instrStart = ingEnd;
  } else if(instrIdx !== -1){
    instrStart = instrIdx+1;
    const foundStart = findIngredientStart(1, instrIdx);
    if(foundStart !== -1){
      titleEndIdx = foundStart;
      ingStart = foundStart;
      const scanResult = scanIngredientBlock(ingStart, instrIdx);
      ingEnd = scanResult.end;
      const absorbed = absorbLeadingLabel(titleEndIdx, scanResult);
      titleEndIdx = absorbed; ingStart = absorbed;
    } else {
      titleEndIdx = instrIdx;
    }
  } else {
    const foundStart = findIngredientStart(1, rawLines.length);
    if(foundStart !== -1){
      titleEndIdx = foundStart;
      ingStart = foundStart;
      const scanResult = scanIngredientBlock(ingStart, rawLines.length);
      ingEnd = scanResult.end;
      instrStart = ingEnd;
      const absorbed = absorbLeadingLabel(titleEndIdx, scanResult);
      titleEndIdx = absorbed; ingStart = absorbed;
    } else {
      titleEndIdx = rawLines.length;
    }
  }

  const preLines = rawLines.slice(0, titleEndIdx).filter(l=>l);
  const name = preLines[0] || '';
  const description = preLines.slice(1).join(' ');

  const ingLines = (ingStart !== -1) ? rawLines.slice(ingStart, ingEnd).filter(l=>l) : [];
  const instrLines = (instrStart !== -1) ? rawLines.slice(instrStart).filter(l=>l) : [];

  const ingredients = ingLines.map(line=>{
    const clean = line.replace(/^[-*•●▪️○\u2022]\s*/, '').replace(/^\[\s?[xX]?\s?\]\s*/, '').trim();
    const extracted = extractIngredientAmount(clean);
    if(extracted) return { id: uid(), amount: extracted.amount, unit: extracted.unit, name: extracted.name, checked:false, optional:false };
    return { id: uid(), amount: null, unit:'', name: clean, checked:false, optional:false };
  }).filter(i=>i.name);

  const instructions = instrLines.map(line=>{
    return line.replace(/^\d+[\.\)]\s*/, '').replace(/^step\s*\d+[:.]?\s*/i,'').trim();
  }).filter(Boolean).map(text=>({ id: uid(), text, checked:false, images: [] }));

  return { name, description, ingredients, instructions };
}
function applyParsedRecipe(r, parsed){
  if(parsed.name) r.name = parsed.name;
  if(parsed.description) r.description = parsed.description;
  if(parsed.ingredients && parsed.ingredients.length) r.ingredientGroups = [{ id: uid(), name:'', items: parsed.ingredients }];
  if(parsed.instructions && parsed.instructions.length) r.instructionGroups = [{ id: uid(), name:'', items: parsed.instructions }];
  refreshBody(r);
}

function openPasteTextModal(r){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Paste recipe text</h3>
      <p class="hint" style="margin:0 0 10px 0;">Paste a recipe below. If it has "Ingredients" and "Instructions" headers, it'll parse into a draft you can review and clean up.</p>
      <textarea id="pasteTextArea" style="width:100%;min-height:220px;border:1px solid var(--hairline-strong);background:var(--paper-raised);border-radius:8px;padding:10px;font-size:13.5px;outline:none;resize:vertical;"></textarea>
      <div class="modal-add-row">
        <button id="parsePasteBtn" style="flex:1;">Parse &amp; fill</button>
      </div>
      <button class="modal-close" id="closePasteModal">Cancel</button>
    </div>`;
  removeAllModals();
  document.body.appendChild(backdrop);
  document.getElementById('parsePasteBtn').addEventListener('click', ()=>{
    const text = document.getElementById('pasteTextArea').value;
    if(!text.trim()){ safeRemoveModal(backdrop); return; }
    const parsed = parseRecipeText(text);
    applyParsedRecipe(r, parsed);
    safeRemoveModal(backdrop);
  });
  document.getElementById('closePasteModal').addEventListener('click', ()=> safeRemoveModal(backdrop));
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) safeRemoveModal(backdrop); });
}

let tesseractLoadPromise = null;
function ensureTesseractLoaded(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Could not load the OCR library. Check your internet connection and try again.'));
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}
function openScanPhotoFlow(r){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    document.body.removeChild(input);
    if(!file) return;

    const overlay = document.createElement('div');
    removeAllModals();
    overlay.className = 'modal-backdrop';
    overlay.id = 'ocrOverlay';
    overlay.innerHTML = `
      <div class="modal" style="text-align:center;">
        <h3>Reading photo…</h3>
        <p class="hint" id="ocrStatus">Loading OCR engine (first time may take a moment)…</p>
      </div>`;
    document.body.appendChild(overlay);

    try{
      await ensureTesseractLoaded();
      const statusEl = document.getElementById('ocrStatus');
      if(statusEl) statusEl.textContent = 'Recognizing text in your photo…';
      const worker = await Tesseract.createWorker('eng');
      const { data } = await worker.recognize(file);
      await worker.terminate();
      safeRemoveModal(overlay);
      const parsed = parseRecipeText(data.text || '');
      applyParsedRecipe(r, parsed);
    }catch(err){
      const existingOverlay = document.getElementById('ocrOverlay');
      if(existingOverlay) safeRemoveModal(existingOverlay);
      alert(err.message || 'Something went wrong reading that photo. Please try again.');
    }
  });
  input.click();
}

function escHtml(s){ return (s||'').toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function focusLast(selector){ const els = document.querySelectorAll(selector); if(els.length) els[els.length-1].focus(); }
function autosize(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }
function autosizeAll(){ document.querySelectorAll('textarea').forEach(autosize); }

/* =========================================================
   INIT — load data (IndexedDB, migrating from localStorage if needed), then render
========================================================= */
async function bootstrap(){
  try{
    data = await loadAppData();
  }catch(err){
    console.error('Fatal error loading app data:', err);
  }
  if(!Array.isArray(data.pantryCategories)) data.pantryCategories = [];
  if(!Array.isArray(data.pantry)) data.pantry = [];
  if(!Array.isArray(data.shoppingList)) data.shoppingList = [];
  if(!Array.isArray(data.equipmentCategories) || data.equipmentCategories.length === 0) data.equipmentCategories = [...DEFAULT_EQUIPMENT_CATEGORIES];
  if(!Array.isArray(data.equipment)) data.equipment = [];
  if(!Array.isArray(data.equipmentTypes)) data.equipmentTypes = [...DEFAULT_EQUIPMENT_TYPES];
  data.pantry = data.pantry.map(migratePantryItem);
  data.equipment = data.equipment.map(migrateEquipmentItem);
  if(data.recipes && data.recipes.length){
    data.recipes = data.recipes.map(migrateRecipe);
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden' && saveDebounceTimer) flushSave();
  });
  window.addEventListener('beforeunload', ()=>{
    if(saveDebounceTimer) flushSave();
  });
  render();
}
bootstrap();
</script>
